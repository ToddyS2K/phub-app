<!--
  PHub - Mini App di Telegram (Fase 2, 16/11/2026). Pagina statica per GitHub Pages (repository phub-app).
  Nessun dato qui: l'archivio cifrato sta in un gist segreto e si decifra nel browser.

  Il frammento dell'indirizzo (dopo #, non arriva a nessun server) porta: g = gist, k = chiave (32 byte, base64url),
  f = file nel gist (facoltativo). In alternativa u = indirizzo di un file cifrato; #demo apre i dati di prova.
  Formato FL1, lo stesso di phub/crypto.py e del grafico di FL444: "FL1" + nonce (16) + tag (32) + dati, in base64;
  tag HMAC-SHA256 su nonce + dati, keystream HMAC-SHA256(nonce || contatore), chiavi HMAC(k, "enc"/"mac"); poi zlib.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #eef2f5; --surface: #ffffff; --fg: #15202b; --muted: #5b6977; --line: #d6dee5; --accent: #2b7bc9;
  --up: #1e9a68; --down: #cf4556; --track: #e3e9ee; --err: #b42318;
  --c1: #2b7bc9; --c2: #1e9a68; --c3: #dd7a17; --c4: #6d4fd1; --c5: #c99a0e; --c6: #cf4556; --c7: #0e9aa7; --c8: #8794a1;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1621; --surface: #17212b; --fg: #e4ebf2; --muted: #8a9aab; --line: #263444; --accent: #5ea8f2;
  --up: #3dbb87; --down: #ee6a79; --track: #223040; --err: #f2545b;
  --c1: #5ea8f2; --c2: #3dbb87; --c3: #f0954a; --c4: #a58cf5; --c5: #e2b63a; --c6: #ee6a79; --c7: #34c3cf; --c8: #7c8b9b;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1621; --surface: #17212b; --fg: #e4ebf2; --muted: #8a9aab; --line: #263444; --accent: #5ea8f2;
  --up: #3dbb87; --down: #ee6a79; --track: #223040; --err: #f2545b;
  --c1: #5ea8f2; --c2: #3dbb87; --c3: #f0954a; --c4: #a58cf5; --c5: #e2b63a; --c6: #ee6a79; --c7: #34c3cf; --c8: #7c8b9b;
  color-scheme: dark }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--font-ui); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  padding-bottom: calc(24px + var(--tg-safe-area-inset-bottom, 0px)); }
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
h1 { font-size: 19px; font-weight: 600; margin: 0; }
h2 { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.msg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; color: var(--muted); }
.msg.err { color: var(--err); border-color: var(--err); }
.msg a { color: var(--accent); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

nav.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  background: var(--bg); padding: 4px 0 8px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: 1 0 auto; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: var(--muted); border: 1px solid transparent; white-space: nowrap; }
.badge { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.todo { color: var(--c3); border-color: var(--c3); }
.badge.late { color: var(--down); border-color: var(--down); }
.badge.soon { color: var(--c5); border-color: var(--c5); }
.com { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; text-align: left; padding: 10px 2px; border-top: 1px solid var(--line); }
.com:first-child { border-top: 0; }
.com .t { font-weight: 600; }
.com .m { font-size: 12.5px; color: var(--muted); }
.com .r { grid-column: 1 / -1; font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.prose { font-size: 14.5px; line-height: 1.55; white-space: pre-line; }
a.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 500; }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); font-weight: 600; border-color: var(--line); }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi .lbl { font-size: 12px; color: var(--muted); }

    h += '<div class="chead">' + cic(p.icona, col, "xl") + '<div><div class="t" style="font-size:17px">' + esc(p.nome) + "</div>" +
      (p.descrizione ? '<div class="mtopic" style="color:var(--muted)">' + esc(p.descrizione) + "</div>" : "") +
      '<div class="mbadges">' + badges.join("") + "</div></div><span></span></div>";
    // numeri
    if (started) h += '<div class="grid2">' + cell("Valore", money(p.value)) + cell("Investito", money(p.cost)) +
      cell("P&amp;L", '<span class="' + cls(p.pnl) + '">' + smoney(p.pnl) + (p.pnl_pct != null ? " (" + pct(p.pnl_pct) + ")" : "") + "</span>") +
      cell("Ultimo acquisto", p.last_buy ? dmy(p.last_buy) : "–") + "</div>";
    else h += '<div class="callout" style="--k:var(--accent)">' + ico("info") + '<div><span class="h">Piano da avviare</span>' +
      "Nessun acquisto ancora nei dati di Interactive Brokers. Gli acquisti compaiono qui il giorno dopo l'esecuzione.</div></div>";
    // prossimo acquisto
    var nx = p.prossimo || [];
    if (nx.length) {
      var title = p.acquisto === "fisso" ? "Versamento del mese" : p.acquisto === "iniziale" ? (started ? "Da completare: primo acquisto" : "Primo acquisto") : "Prossimo acquisto";
      var body = nx.map(function (x) { return "<b>" + esc(x.simbolo) + "</b> " + money(x.eur, null, 0); }).join(" · ");
      if (p.acquisto === "sottopeso") {
        var e = (p.etf || []).filter(function (y) { return y.simbolo === nx[0].simbolo; })[0];
        if (e) body += '<div class="sub" style="margin-top:2px">È il più sotto peso: ' + num(e.weight, 1) + "% contro l'obiettivo del " + num(e.peso, 0) + "%.</div>";
      }
      h += '<div class="callout" style="--k:var(' + col + ')">' + ico("arrow") + '<div><span class="h">' + title + "</span>" + body + "</div></div>";
    }
    // allocazione
    h += "<div>" + head("target", "Allocazione", (p.etf || []).length) + (p.etf || []).map(function (x) {
      var dev = x.deviation, big = dev != null && Math.abs(dev) >= 5;
      return '<div class="pac-row"><div class="pac-top"><span><b>' + esc(x.simbolo) + '</b> <span class="sub">' + esc(x.ruolo) + "</span></span>" +
        '<span class="num">' + (x.held ? money(x.value) : '<span class="sub">da acquistare</span>') + "</span></div>" +
        '<div class="pbar"><i style="width:' + Math.min(100, x.weight || 0) + '%"></i><b style="left:' + Math.min(100, x.peso) + '%" title="obiettivo"></b></div>' +
        '<div class="pac-bot"><span>' + (x.held ? num(x.weight, 1) + "% · " : "") + "obiettivo " + num(x.peso, 0) + "%" +
        (dev != null ? ' <span class="' + (big ? "badge soon" : "sub") + '">' + (dev > 0 ? "+" : dev < 0 ? "−" : "") + num(Math.abs(dev), 1) + " pt</span>" : "") + "</span>" +
        "<span>" + (x.mensile ? money(x.mensile, null, 0) + "/mese" : "") +
        (x.held && x.pnl_pct != null ? ' · <span class="' + cls(x.pnl) + '">' + pct(x.pnl_pct) + "</span>" : "") + "</span></div></div>";
    }).join("") + "</div>";
    // fasi
    if ((p.fasi || []).length) h += "<div>" + head("history", "Fasi del piano") + '<div class="phases">' + p.fasi.map(function (f) {
      var on = p.fase && p.fase.nome === f.nome;
      return '<div class="phase' + (on ? " on" : "") + '"><div class="pn">' + esc(f.nome) + (on ? ' <span class="badge acc">attuale</span>' : "") + "</div>" +
        '<div class="sub">Anni ' + f.da + "–" + f.a + " · " + esc(f.allocazione || "") + "</div>" + (f.cosa ? '<div class="pc">' + esc(f.cosa) + "</div>" : "") + "</div>";
    }).join("") + "</div></div>";
    // satelliti
    if ((p.satelliti || []).length) h += "<div>" + head("star", "Fuori dal piano") + p.satelliti.map(function (s) {
      return '<div class="pac-row"><div class="pac-top"><span><b>' + esc(s.simbolo) + '</b> <span class="sub">' + esc(s.ruolo) + "</span></span>" +
        '<span class="num">' + (s.held ? money(s.value) + (s.pnl_pct != null ? ' <span class="' + cls(s.pnl) + '">' + pct(s.pnl_pct) + "</span>" : "") : "") + "</span></div>" +
        (s.regola ? '<div class="sub" style="margin-top:3px">' + esc(s.regola) + "</div>" : "") + "</div>";
    }).join("") + "</div>";
    // regole
    if ((p.regole || []).length) h += '<details class="rules"><summary>' + ico("book") + "Regole del piano (" + p.regole.length + ")" + ico("chev", "chev") + "</summary><ul>" +
      p.regole.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul>" +
      (p.ribilanciamento ? '<div class="sub">Ribilanciamento: ' + esc(p.ribilanciamento) + "</div>" : "") + "</details>";
    return h + "</div>";
  }

  // ---------------------------------------------------------------- Condominio (sezione "condominio" dell'archivio)
  function C() {
    var c = D.condominio || {};
    ["comunicazioni", "spese", "riunioni", "decisioni", "norme", "pratiche"].forEach(function (k) { c[k] = c[k] || {}; });
    c.meta = c.meta || {};
    return c;
  }
  function list(obj) { return Object.keys(obj).map(function (k) { var x = obj[k]; x.id = k; return x; }); }
  function byDate(field) { return function (a, b) { return (b[field] || "").localeCompare(a[field] || ""); }; }
  function stateOf(x) { var s = C().summary; return (s && s.states && s.states[x.id]) || x.stato || "Da leggere"; }
  function daysTo(d) { return d ? Math.round((Date.parse(d.slice(0, 10)) - Date.parse(new Date().toISOString().slice(0, 10))) / 864e5) : null; }
  function longDate(d) {
    if (!d) return "";
    var x = new Date(d.slice(0, 10) + "T12:00:00");
    return isNaN(x) ? dmy(d) : x.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  function cap(s) { s = String(s || "").trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }
  function dueBadge(d) {
    var n = daysTo(d); if (n == null) return "";
    var cl = n < 0 ? "late" : n <= 7 ? "soon" : "";
    var tx = n < 0 ? "scaduta il " + dmy(d) : n === 0 ? "scade oggi" : n === 1 ? "scade domani" : "entro il " + dmy(d);
    return '<span class="badge ' + cl + '">' + ico(n < 0 ? "alert" : "clock") + tx + "</span>";
  }
  function head(icon, title, n, more) {
    return '<div class="shead">' + ico(icon) + "<h2>" + title + "</h2>" + (n != null ? '<span class="count">' + n + "</span>" : "") +
      (more ? '<button type="button" class="more" data-goto="' + more[0] + '">' + more[1] + "</button>" : "") + "</div>";
  }
  function empty(t) { return '<div class="msg">' + t + "</div>"; }

  // categoria della comunicazione -> icona e colore
  var CATS = [["convoc", "calendar", "--c1"], ["acta", "doc", "--c4"], ["derrama", "euro", "--c3"], ["quota", "euro", "--c2"],
    ["bilancio", "chart", "--c7"], ["lavori", "tool", "--c3"], ["moros", "alert", "--c6"], ["regolam", "book", "--c4"],
    ["circolare", "megaphone", "--c1"], ["incidente", "bank", "--c6"], ["pratica", "folder", "--c5"]];
  function catOf(c) {
    var k = String(c || "").toLowerCase();
    for (var i = 0; i < CATS.length; i++) if (k.indexOf(CATS[i][0]) >= 0) return CATS[i];
    return ["", "mail", "--c8"];
  }
  function cic(icon, color, cls) { return '<span class="cic' + (cls ? " " + cls : "") + '" style="--k:var(' + color + ')">' + ico(icon) + "</span>"; }
  function stateBadge(st) {
    return st === "Da fare" ? '<span class="badge todo">' + ico("task") + "da fare</span>" :
      st === "Da leggere" ? '<span class="badge acc">' + ico("inbox") + "da leggere</span>" :
      st === "Archiviata" ? '<span class="badge">' + ico("check") + "archiviata</span>" : "";
  }
  function comRow(x) {
    var st = stateOf(x), cat = catOf(x.categoria);
    return '<button type="button" class="com wi" data-com="' + esc(x.id) + '">' + cic(cat[1], cat[2]) +
      '<span><div class="t">' + esc(x.oggetto || "(senza oggetto)") + '</div><div class="m">' +
      [dmy(x.data), x.categoria, x.amministrazione].filter(Boolean).map(esc).join(" · ") + "</div></span>" +
      '<span class="bl">' + stateBadge(st) + (st !== "Archiviata" && x.scadenza ? dueBadge(x.scadenza) : "") + "</span>" +
      (x.riassunto ? '<span class="r">' + esc(x.riassunto) + "</span>" : "") + "</button>";
  }

  // ---- assemblee
  var TIPI = { "junta general extraordinaria": "Assemblea straordinaria", "junta general ordinaria": "Assemblea ordinaria" };
  var ESITI = { "Approvata": ["check", "--up", "approvata", "approvate"], "Respinta": ["x", "--down", "respinta", "respinte"],
    "Rinviata": ["pause", "--c5", "rinviata", "rinviate"], "Informativa": ["info", "--c8", "informativa", "informative"] };
  function meetTitle(r) {
    var tipo = TIPI[String(r.tipo || "").toLowerCase()];
    var m = /\(([^()]+)\)\s*$/.exec(r.riunione || "");
    return tipo ? { t: tipo, topic: m ? cap(m[1]) : "" } : { t: r.riunione || r.tipo || "Riunione", topic: "" };
  }
  function meetState(r) {
    var n = daysTo(r.data);
    if (/acta|verbale/i.test(r.stato || "")) return '<span class="badge ok">' + ico("doc") + "verbale ricevuto</span>";
    if (n != null && n >= 0) return '<span class="badge acc">' + ico("calendar") + "convocata · " + (n === 0 ? "oggi" : n === 1 ? "domani" : "tra " + n + " giorni") + "</span>";
    return '<span class="badge soon">' + ico("hourglass") + "in attesa del verbale</span>";
  }
  function dateTile(d, past) {
    if (!d) return '<div class="dtile' + (past ? " past" : "") + '"><div class="mo">—</div><div class="dd">–</div><div class="yy"></div></div>';
    return '<div class="dtile' + (past ? " past" : "") + '"><div class="mo">' + MONTHS_L[+d.slice(5, 7) - 1].slice(0, 3) + '</div><div class="dd">' +
      d.slice(8, 10) + '</div><div class="yy">' + d.slice(0, 4) + "</div></div>";
  }
  // "Ore 15:00 (1a conv.) / 15:30 (2a conv.), Luogo. 1) Punto (maggioranza ...). 2) ..." -> orario, luogo, punti
  function parseOdg(text) {
    var s = String(text || "").trim(), out = { when: "", where: "", intro: "", points: [] };
    if (!s) return out;
    function split(re) {                              // punti numerati 1, 2, 3... in ordine, altrimenti nulla
      var ps = s.split(re);
      if (ps.length < 3) return null;
      for (var j = 1; j < ps.length; j += 2) if (+ps[j] !== (j + 1) / 2) return null;
      return ps;
    }
    var parts = split(/(?:^|\s)(\d{1,2})\)\s+/) || split(/(?:^|\n)\s*(\d{1,2})[.)]\s+/), i;
    if (!parts) { out.intro = s; return out; }
    for (i = 1; i < parts.length; i += 2) {
      var p = parts[i + 1].trim().replace(/\.\s*$/, ""), maj = "";
      var m = /\s*\(((?:maggioranz|quorum|unanimit)[^()]*)\)\s*$/i.exec(p);
      if (m) { maj = cap(m[1]); p = p.slice(0, m.index).trim(); }
      out.points.push({ text: p, maj: maj });
    }
    var pre = parts[0].trim().replace(/\.\s*$/, "");
    if (pre) {
      var segs = pre.split(/,\s+/), when = [];
      while (segs.length && /\d{1,2}[:.]\d{2}/.test(segs[0])) when.push(segs.shift());
      if (when.length) { out.when = when.join(", ").replace(/\s*\/\s*/g, " · "); out.where = segs.join(", "); }
      else out.intro = pre;
    }
    return out;
  }
  function decRow(d) {
    var e = ESITI[d.esito] || ["info", "--c8", String(d.esito || "").toLowerCase()];
    return '<div class="dec" style="--k:var(' + e[1] + ')">' + ico(e[0]) +
      '<div><div class="t">' + esc(d.decisione || "") + '</div><div class="m">' +
      [d.punto ? "Punto " + d.punto : null, d.argomento, d.votazione, d.rate].filter(Boolean).map(esc).join(" · ") + "</div></div>" +
      '<div class="e">' + esc(e[2] || "") + (d.importo != null ? '<div class="num">' + money(d.importo) + "</div>" : "") + "</div>" +
      (d.cosa_fare ? '<div class="act">' + ico("arrow") + "<span>" + esc(d.cosa_fare) + "</span></div>" : "") + "</div>";
  }
  function esitiSummary(ds) {
    var n = {}; ds.forEach(function (d) { n[d.esito] = (n[d.esito] || 0) + 1; });
    return ["Approvata", "Respinta", "Rinviata", "Informativa"].filter(function (k) { return n[k]; }).map(function (k) {
      var e = ESITI[k]; return '<span style="--k:var(' + e[1] + ')">' + ico(e[0]) + n[k] + " " + (n[k] === 1 ? e[2] : e[3]) + "</span>";
    }).join("");
  }
  function meetDocs(r) {
    var cs = (r.comunicazioni || []).map(function (id) { var x = C().comunicazioni[id]; return x ? Object.assign({ id: id }, x) : null; }).filter(Boolean);
    if (!cs.length) return "";
    return '<div class="doclinks">' + cs.map(function (x) {
      var k = String(x.categoria || "").toLowerCase(), lbl = k.indexOf("acta") >= 0 ? "Verbale" : k.indexOf("convoc") >= 0 ? "Convocazione" : "Comunicazione";
      return '<button type="button" class="lnk" data-com="' + esc(x.id) + '">' + ico(catOf(x.categoria)[1]) + lbl + " del " + dmy(x.data) + "</button>";
    }).join("") + "</div>";
  }
  function meetBody(r, ds) {
    var o = parseOdg(r.ordine_del_giorno), h = "";
    if (o.when || o.where) h += '<div class="where">' + (o.when ? "<div>" + ico("clock") + "<span>" + esc(o.when) + "</span></div>" : "") +
      (o.where ? "<div>" + ico("pin") + "<span>" + esc(o.where) + "</span></div>" : "") + "</div>";
    if (o.points.length) h += "<div>" + head("list", "Ordine del giorno", o.points.length) + '<ol class="odg">' + o.points.map(function (p, i) {
      return '<li><span class="n">' + (i + 1) + "</span><span>" + esc(p.text) + (p.maj ? '<br><span class="maj">' + ico("vote") + esc(p.maj) + "</span>" : "") + "</span></li>";
    }).join("") + "</ol></div>";
    if (o.intro) h += "<div>" + head("info", o.points.length ? "Note" : "Dettagli") + '<div class="prose" style="font-size:14px">' + esc(o.intro) + "</div></div>";
    if (r.da_fare) h += '<div class="callout">' + ico("task") + '<div><span class="h">Cosa devi fare</span>' + esc(r.da_fare) + "</div></div>";
    if (ds.length) h += "<div>" + head("vote", "Decisioni", ds.length) + ds.map(decRow).join("") + "</div>";
    else if (r.decisioni) h += "<div>" + head("vote", "Decisioni") + '<div class="prose" style="font-size:14px">' + esc(r.decisioni) + "</div></div>";
    h += meetDocs(r);
    return h;
  }
  function meetHead(r, past, extra) {
    var mt = meetTitle(r);
    return '<div class="mhead">' + dateTile(r.data, past) + '<div><div class="mtitle">' + esc(mt.t) + "</div>" +
      (mt.topic ? '<div class="mtopic">' + esc(mt.topic) + "</div>" : "") +
      '<div class="mmeta">' + esc(cap(longDate(r.data))) + (TIPI[String(r.tipo || "").toLowerCase()] ? " · " + esc(r.tipo) : "") + "</div>" +
      (extra || "") + "</div>" + (past ? ico("chev", "chev") : "") + "</div>";
  }
  function decsOf(r) {
    return list(C().decisioni).filter(function (d) { return d.riunione === r.id; }).sort(function (a, b) { return (+a.punto || 0) - (+b.punto || 0); });
  }
  function upcoming() {
    return list(C().riunioni).filter(function (r) { return !/acta|verbale/i.test(r.stato || "") && daysTo(r.data) >= 0; })
      .sort(function (a, b) { return (a.data || "").localeCompare(b.data || ""); });
  }
  function meetCard(r) {
    var ds = decsOf(r);
    return '<div class="card meet">' + meetHead(r, false, '<div class="mbadges">' + meetState(r) + "</div>") + meetBody(r, ds) + "</div>";
  }
  function pastCard(r) {
    var ds = decsOf(r);
    var extra = '<div class="mbadges">' + meetState(r) + "</div>" + (ds.length ? '<div class="esiti">' + esitiSummary(ds) + "</div>" : "");
    return '<details class="card past"><summary>' + meetHead(r, true, extra) + '</summary><div class="meet">' + meetBody(r, ds) + "</div></details>";
  }
  function cMeet() {
    var up = upcoming(), ids = {}, dec = list(C().decisioni);
    up.forEach(function (r) { ids[r.id] = 1; });
    var past = list(C().riunioni).filter(function (r) { return !ids[r.id]; }).sort(byDate("data"));
    if (!up.length && !past.length && !dec.length) return empty("Nessuna assemblea in archivio.");
    var h = "";
    if (up.length) h += '<div class="sect">' + ico("calendar") + "Prossime</div>" + up.map(meetCard).join("");
    if (past.length) h += '<div class="sect">' + ico("history") + "Svolte</div>" + '<div class="stack cgrid">' + past.map(pastCard).join("") + "</div>";
    var orphan = dec.filter(function (d) { return !C().riunioni[d.riunione]; });
    if (orphan.length) h += '<div class="card">' + head("vote", "Altre decisioni", orphan.length) + orphan.map(decRow).join("") + "</div>";
    return '<div class="stack">' + h + "</div>";
  }

  // ---- in evidenza
  function cTodo() {
    var coms = list(C().comunicazioni), s = C().summary || {};
    var todo = coms.filter(function (x) { return stateOf(x) === "Da fare"; }).sort(function (a, b) { return (a.scadenza || "9999").localeCompare(b.scadenza || "9999"); });
    var read = coms.filter(function (x) { return stateOf(x) === "Da leggere"; }).sort(byDate("data"));
    var up = upcoming(), h = "";
    if (s.stale_days > 3) h += '<div class="msg err">La routine non invia dati da ' + s.stale_days + " giorni: verificala su claude.ai.</div>";
    if (up.length) h += '<div class="sect">' + ico("calendar") + "Prossime assemblee</div>" + up.map(meetCard).join("");
    h += '<div class="ctwo"><div class="card">' + head("task", "Da fare", todo.length) +
      (todo.length ? '<div class="list">' + todo.map(comRow).join("") + "</div>" : '<div class="sub">Nessuna azione richiesta.</div>') + "</div>";
    h += '<div class="card">' + head("inbox", "Da leggere", read.length, ["c-coms", "Tutte le comunicazioni"]) +
      (read.length ? '<div class="list">' + read.map(comRow).join("") + "</div>" : '<div class="sub">Nessuna comunicazione da leggere.</div>') + "</div></div>";
    return '<div class="stack">' + h + "</div>";
  }

  // ---- comunicazioni
  function cComs() {
    var coms = list(C().comunicazioni).sort(byDate("data"));
    if (!coms.length) return empty("Nessuna comunicazione in archivio.");
    var h = '<div class="card">' + head("mail", "Comunicazioni", coms.length) + '<div class="list">', month = "";
    coms.forEach(function (x) {
      var m = (x.data || "").slice(0, 7);
      if (m && m !== month) { month = m; h += '<div class="month">' + MONTHS_L[+m.slice(5, 7) - 1] + " " + m.slice(0, 4) + "</div>"; }
      h += comRow(x);
    });
    return h + "</div></div>";
  }
  function cCom(id) {
    var x = C().comunicazioni[id]; if (!x) return empty("Comunicazione non trovata.");
    var st = stateOf(Object.assign({ id: id }, x)), cat = catOf(x.categoria);
    var h = backBtn();
    h += '<div class="card"><div class="chead">' + cic(cat[1], cat[2], "xl") + '<div><div class="t">' + esc(x.oggetto || "") + '</div><div class="metas" style="margin-top:5px">' +
      [[ico("calendar"), dmy(x.data)], [ico(cat[1]), x.categoria], [ico("users"), x.amministrazione]].filter(function (f) { return f[1]; })
        .map(function (f) { return "<span>" + f[0] + esc(f[1]) + "</span>"; }).join("") + '</div><div class="mbadges">' + stateBadge(st) +
      (st !== "Archiviata" && x.scadenza ? dueBadge(x.scadenza) : "") + "</div></div><span></span></div></div>";
    h += '<div class="card">' + head("doc", "Riassunto") + '<div class="prose">' + esc(x.riassunto || "—") + "</div></div>";
    var facts = [["mail", "Mittente", x.mittente], ["clip", "Allegati", x.allegati], ["clock", "Scadenza", x.scadenza ? longDate(x.scadenza) : null]].filter(function (f) { return f[2]; });
    if (facts.length || x.link) h += '<div class="card">' + head("info", "Dettagli") + '<dl class="facts">' + facts.map(function (f) {
      return "<dt>" + ico(f[0]) + " " + f[1] + "</dt><dd>" + esc(f[2]) + "</dd>"; }).join("") + "</dl>" +
      (x.link ? '<div style="margin-top:12px"><a class="btn" href="' + esc(x.link) + '" target="_blank" rel="noopener" data-ext>' + ico("mail") + "Apri l'email in Gmail</a></div>" : "") + "</div>";
    var rs = list(C().riunioni).filter(function (r) { return (r.comunicazioni || []).indexOf(id) >= 0; });
    rs.forEach(function (r) { h += '<div class="sect">' + ico("users") + "Assemblea collegata</div>" + meetCard(r); });
    var sp = list(C().spese).filter(function (s) { return s.comunicazione === id; });
    if (sp.length) h += '<div class="card">' + head("euro", "Importi collegati", sp.length) + sp.map(speseRow).join("") + "</div>";
    return '<div class="stack">' + h + "</div>";
  }

  // ---- pratiche
  function cCases() {

        .filter(function (f) { return f[1]; }).map(function (f) { return "<span>" + ico(f[0]) + esc(f[1]) + "</span>"; }).join("");
      return '<div class="card meet"><div class="chead">' + cic("folder", closed ? "--c8" : "--c5") + '<div><div class="t">' + esc(p.pratica || "") + '</div><div class="mbadges">' + badge + "</div></div><span></span></div>" +
        (metas ? '<div class="metas">' + metas + "</div>" : "") +

        (p.prossimo_passo && !closed ? '<div class="callout">' + ico("arrow") + '<div><span class="h">Prossimo passo</span>' + esc(p.prossimo_passo) + "</div></div>" : "") +
        (p.link ? '<div><a class="btn" href="' + esc(p.link) + '" target="_blank" rel="noopener" data-ext>' + ico("mail") + "Apri il thread in Gmail</a></div>" : "") + "</div>";
    }).join("") + "</div>";
  }

  // ---- quote e spese
  function speseRow(s) {
    var cat = catOf(s.tipo);

      [s.tipo, s.periodo, s.data ? dmy(s.data) : null].filter(Boolean).map(esc).join(" · ") + "</div></span>" +
      '<span class="bd"><div class="num" style="font-weight:600">' + (s.importo != null ? money(s.importo) : '<span class="sub">importo nel PDF</span>') + "</div>" +

  }
  function cSpese() {
    var sp = list(C().spese).sort(byDate("data"));
    if (!sp.length) return empty("Nessuna spesa in archivio.");
    var years = {};
    sp.forEach(function (s) { var y = (s.data || "").slice(0, 4) || "—"; years[y] = years[y] || { tot: 0, items: [] }; years[y].items.push(s); if (s.importo != null) years[y].tot += s.importo; });
    return '<div class="stack">' + Object.keys(years).sort().reverse().map(function (y) {
      return '<div class="card"><div class="ysum"><span class="y">' + y + '</span><span class="s">' + years[y].items.length + (years[y].items.length === 1 ? " voce" : " voci") +
        (years[y].tot ? ' · totale noto <b class="num">' + money(years[y].tot) + "</b>" : "") + "</span></div>" + years[y].items.map(speseRow).join("") + "</div>";
    }).join("") + '<div class="sub">I pagamenti sono automatici. Il totale comprende solo gli importi letti nelle email o nei PDF.</div></div>';
  }

  // ---- regolamento
  function cNorme() {
    var ns = list(C().norme).sort(function (a, b) { return ((b.in_vigore ? 1 : 0) - (a.in_vigore ? 1 : 0)) || (b.data || "").localeCompare(a.data || ""); });
    if (!ns.length) return empty("Nessuna norma in archivio.");
    return '<div class="stack cgrid">' + ns.map(function (n) {
      return '<div class="card meet"><div class="chead">' + cic("book", n.in_vigore ? "--c4" : "--c8") + '<div><div class="t">' + esc(n.norma || "") + '</div><div class="metas" style="margin-top:4px">' +
        [["book", n.argomento], ["calendar", n.data ? dmy(n.data) : null]].filter(function (f) { return f[1]; }).map(function (f) { return "<span>" + ico(f[0]) + esc(f[1]) + "</span>"; }).join("") +
        "</div></div>" + (n.in_vigore ? '<span class="badge ok">' + ico("check") + "in vigore</span>" : '<span class="badge">superata</span>') + "</div>" +
        (n.riassunto ? '<div class="prose" style="font-size:14px">' + esc(n.riassunto) + "</div>" : "") + "</div>";
    }).join("") + "</div>";
  }

  // ---------------------------------------------------------------- Crypto (sezione "crypto" dell'archivio, da Kraken)
  function K() { var k = D.crypto || {}; k.snapshots = k.snapshots || {}; return k; }
  function kColor(i) { return tok(COLORS[i % COLORS.length]); }
  function kq(x) { return Number(x).toLocaleString("it-IT", { maximumFractionDigits: Math.abs(x) >= 1 ? 4 : 8 }); }
  function kHome() {
    var s = K().summary;
    if (!s) return empty("Nessun dato: il primo aggiornamento da Kraken non è ancora avvenuto.");
    var h = '<div class="home"><div class="kpis">';
    h += '<div class="card kpi big"><div class="lbl">Totale</div><div class="val num">' + money(s.total) + "</div>" +
      (s.day_change != null ? '<div class="det num ' + cls(s.day_change) + '">' + smoney(s.day_change) + " (" + pct(s.day_change_pct) + ") ultimo giorno</div>" : "") + "</div>";
    h += '<div class="card kpi"><div class="lbl">P&amp;L non realizzato</div><div class="val num ' + cls(s.pnl) + '">' + smoney(s.pnl) + '</div><div class="det num ' + cls(s.pnl) + '">' + (s.pnl_pct != null ? pct(s.pnl_pct) : "–") + "</div></div>";
    h += '<div class="card kpi"><div class="lbl">In crypto</div><div class="val num">' + money(s.invested) + '</div><div class="det num" style="color:var(--muted)">costo ' + money(s.cost) + "</div></div>";
    h += '<div class="card kpi"><div class="lbl">Liquidità</div><div class="val num">' + money(s.cash) + '</div><div class="det" style="color:var(--muted)">su Kraken</div></div>';
    h += '<div class="card kpi"><div class="lbl">Realizzato</div><div class="val num ' + cls(s.realized) + '">' + smoney(s.realized) + '</div><div class="det num" style="color:var(--muted)">staking ' + money(s.rewards_value) + "</div></div>";
    h += "</div>";
    var ps = s.positions.filter(function (p) { return p.value != null && !p.dust; }), tot = ps.reduce(function (a, p) { return a + p.value; }, 0) || 1;
    var a0 = -Math.PI / 2, seg = "";
    ps.forEach(function (p, i) {
      var f = p.value / tot, a1 = a0 + f * 2 * Math.PI, R = 60, r = 40, s0 = a0 + 0.012, e0 = a1 - 0.012, lg = e0 - s0 > Math.PI ? 1 : 0;
      if (f >= 0.9999) seg += '<circle cx="75" cy="75" r="50" fill="none" stroke="' + kColor(i) + '" stroke-width="20"/>';
      else if (e0 > s0) seg += '<path fill="' + kColor(i) + '" d="M' + (75 + R * Math.cos(s0)) + " " + (75 + R * Math.sin(s0)) + " A60 60 0 " + lg + " 1 " + (75 + R * Math.cos(e0)) + " " + (75 + R * Math.sin(e0)) +
        " L" + (75 + r * Math.cos(e0)) + " " + (75 + r * Math.sin(e0)) + " A40 40 0 " + lg + " 0 " + (75 + r * Math.cos(s0)) + " " + (75 + r * Math.sin(s0)) + ' Z"/>';
      a0 = a1;
    });
    h += '<div class="card"><h2>Allocazione</h2><div class="alloc"><svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Allocazione per crypto">' + seg + "</svg><div class=\"legend\">" +
      ps.map(function (p, i) { return '<div class="lg"><i class="sw" style="background:' + kColor(i) + '"></i><span class="nm">' + esc(p.asset) + '</span><span class="num">' + num(p.weight, 1) + "%</span></div>"; }).join("") + "</div></div></div>";
    var dust = s.positions.filter(function (p) { return p.dust; });
    h += '<div class="card"><h2>Crypto</h2><div class="list">' + s.positions.filter(function (p) { return !p.dust; }).map(function (p) {
      return '<button type="button" class="item" data-kasset="' + esc(p.asset) + '"><span><span class="sym">' + esc(p.asset) + '</span><div class="nm num">' + kq(p.qty) + (p.price != null ? " × " + money(p.price) : "") + "</div>" +
        '<div class="nm num">medio ' + (p.unknown_cost ? "sconosciuto" : money(p.avg_price)) + (p.rewards ? " · staking " + kq(p.rewards) : "") + "</div></span>" +
        '<span class="r"><div class="num">' + money(p.value) + '</div><div class="pct num ' + cls(p.pnl) + '">' + (p.unknown_cost ? "costo sconosciuto" : smoney(p.pnl) + " · " + pct(p.pnl_pct)) + "</div></span></button>";
    }).join("") + "</div>" + (dust.length ? '<div class="sub" style="margin-top:8px">Più ' + dust.length + " briciole sotto 1 € (" + esc(dust.map(function (p) { return p.asset; }).join(", ")) + "): " +
      money(dust.reduce(function (a, p) { return a + (p.value || 0); }, 0)) + " in tutto.</div>" : "") + "</div>";
    if (s.window_start) h += '<div class="sub">Movimenti dal ' + dmy(s.window_start) + ": per le crypto già possedute allora, il costo di carico è il prezzo di quel giorno.</div>";
    if (s.unknown_cost && s.unknown_cost.length) h += '<div class="msg">Costo di carico sconosciuto per ' + esc(s.unknown_cost.join(", ")) + ": sono arrivate su Kraken da fuori. Indica il prezzo medio in config/crypto.toml.</div>";
    return h + "</div>";
  }
  function kMoveRow(m) {
    var neg = m.kind === "Vendita" || m.kind === "Prelievo" || m.kind === "Prelievo EUR";
    var what = m.asset ? kq(Math.abs(m.qty || 0)) + " " + esc(m.asset) : "";
    var from = m.from ? " da " + Object.keys(m.from).map(function (a) { return kq(m.from[a]) + " " + esc(a); }).join(" + ") : "";
    return '<div class="tr"><span class="d num">' + (m.month ? MONTHS[+m.month.slice(5, 7) - 1] + " " + m.month.slice(0, 4) : dmy(m.date)) + '</span><span class="side ' + (neg ? "down" : "up") + '">' + esc(m.kind) + "</span>" +
      '<span class="q num">' + what + from + (m.price ? " × " + money(m.price) : "") + '</span><span class="tot num">' + (m.eur ? money(Math.abs(m.eur)) : "") + "</span>" +
      (m.realized ? '<span class="x num">realizzato <span class="' + cls(m.realized) + '">' + smoney(m.realized) + "</span></span>" : "") + "</div>";
  }
  function kMoves() {
    var s = K().summary; if (!s) return empty("Nessun movimento.");
    // le ricompense di staking non compaiono nell'elenco: restano nel totale ("Staking ricevuto" e KPI Realizzato)
    var ms = s.moves.filter(function (m) { return m.kind !== "Staking"; }).reverse(), h = '<div class="card"><div class="trs">', month = "";
    if (!ms.length) h += '<div class="sub">Nessun movimento negli ultimi 6 mesi.</div>';
    ms.forEach(function (m) {
      var mo = m.date.slice(0, 7);
      if (mo !== month) { month = mo; h += '<div class="month">' + MONTHS_L[+mo.slice(5, 7) - 1] + " " + mo.slice(0, 4) + "</div>"; }
      h += kMoveRow(m);
    });
    return h + '</div></div><div class="sub">Euro versati ' + money(s.eur_deposited) + " · prelevati " + money(s.eur_withdrawn) + ". Le ricompense di staking non sono elencate: sono comprese nelle quantità e nel valore di ogni crypto.</div>";
  }
  function kAsset(a) {
    var s = K().summary, p = (s.positions || []).filter(function (x) { return x.asset === a; })[0];
    var h = backBtn() + '<div class="dhead"><h1>' + esc(a) + "</h1></div>";
    if (p) h += '<div class="card"><h2>Posizione</h2><div class="grid2">' + cell("Quantità", kq(p.qty)) + cell("Peso", num(p.weight, 1) + "%") +
      cell("Prezzo medio di carico", p.unknown_cost ? "sconosciuto" : money(p.avg_price)) + cell("Prezzo di mercato", money(p.price)) +
      cell("Valore", money(p.value)) + cell("Costo", money(p.cost)) + cell("P&amp;L", '<span class="' + cls(p.pnl) + '">' + smoney(p.pnl) + "</span>") +
      cell("Staking ricevuto", kq(p.rewards)) + "</div></div>";
    var ms = s.moves.filter(function (m) { return m.kind !== "Staking" && (m.asset === a || (m.from && m.from[a])); }).reverse();
    return h + '<div class="card"><h2>Movimenti (' + ms.length + ')</h2><div class="trs">' + ms.map(kMoveRow).join("") + "</div></div>";
  }
  function kHist() {
    return '<div class="card"><h2>Valore del conto Kraken</h2><div class="tip" id="ktip"></div><svg class="chart" id="kchart" height="230"></svg></div>' +
      '<div class="sub">Lo storico parte dal primo aggiornamento del Personal HUB: Kraken non fornisce i valori passati del conto.</div>';
  }
  function drawSeries(svgId, tipId, s) {
    var svg = $(svgId), tip = $(tipId);
    if (!svg) return;
    if (s.length < 2) { svg.outerHTML = '<div class="sub">Servono almeno due giorni di dati.</div>'; return; }
    svg.setAttribute("height", wide() ? Math.max(320, Math.min(520, window.innerHeight - 260)) : 230);
    var vals = s.map(function (p) { return p.v; }), f = frame(svg, Math.min.apply(null, vals), Math.max.apply(null, vals), short);
    var t0 = Date.parse(s[0].d), t1 = Date.parse(s[s.length - 1].d);
    var x = function (d) { return f.L + (Date.parse(d) - t0) / ((t1 - t0) || 1) * (f.W - f.L - f.R); };
    var line = s.map(function (p, i) { return (i ? "L" : "M") + x(p.d).toFixed(1) + " " + f.y(p.v).toFixed(1); }).join(" ");
    var ch = vals[vals.length - 1] - vals[0], col = tok(ch >= 0 ? "--up" : "--down");
    svg.innerHTML = f.grid + '<path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2"/>' +
      '<text x="' + f.L + '" y="' + (f.H - 6) + '">' + dm(s[0].d) + '</text><text x="' + (f.W - f.R) + '" y="' + (f.H - 6) + '" text-anchor="end">' + dm(s[s.length - 1].d) + "</text>";
    tip.innerHTML = "dal " + dmy(s[0].d) + ': <b class="num ' + cls(ch) + '">' + smoney(ch) + "</b>";
  }

  // ---------------------------------------------------------------- panoramica
  function donut(cats) {
    var names = Object.keys(cats), R = 60, r = 40, cx = 75, cy = 75, a0 = -Math.PI / 2, out = "";
    var tot = names.reduce(function (s, n) { return s + cats[n].value; }, 0) || 1;
    names.forEach(function (n) {
      var frac = cats[n].value / tot, a1 = a0 + frac * Math.PI * 2;
      if (frac >= 0.9999) { out += '<circle cx="75" cy="75" r="50" fill="none" stroke="' + catColor[n] + '" stroke-width="20"/>'; return; }
      var gap = names.length > 1 ? 0.012 : 0, s = a0 + gap, e = a1 - gap, large = e - s > Math.PI ? 1 : 0;
      if (e > s) {
        out += '<path fill="' + catColor[n] + '" d="M' + (cx + R * Math.cos(s)) + " " + (cy + R * Math.sin(s)) +
          " A" + R + " " + R + " 0 " + large + " 1 " + (cx + R * Math.cos(e)) + " " + (cy + R * Math.sin(e)) +
          " L" + (cx + r * Math.cos(e)) + " " + (cy + r * Math.sin(e)) +
          " A" + r + " " + r + " 0 " + large + " 0 " + (cx + r * Math.cos(s)) + " " + (cy + r * Math.sin(s)) + ' Z"><title>' + esc(n) + "</title></path>";
      }
      a0 = a1;
    });
    return '<svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Allocazione per categoria">' + out +
      '<text x="75" y="72" text-anchor="middle" style="font: 500 11px var(--font-ui); fill: var(--muted)">investito</text>' +
      '<text x="75" y="89" text-anchor="middle" style="font: 500 13px var(--font-num); fill: var(--fg)">' + esc(money(D.summary.invested, CUR, 0)) + "</text></svg>";
  }

  function viewHome() {
    var s = D.summary, cats = s.categories, h = "";
    h += '<div class="kpis">';
    h += '<div class="card kpi big"><div class="lbl">Totale conto</div><div class="val num">' + money(s.total) + "</div>" +
      (s.day_change != null ? '<div class="det num ' + cls(s.day_change) + '">' + smoney(s.day_change) + " (" + pct(s.day_change_pct) + ') ultimo giorno</div>' : "") + "</div>";
    h += '<div class="card kpi"><div class="lbl">P&amp;L non realizzato</div><div class="val num ' + cls(s.pnl) + '">' + smoney(s.pnl) + '</div><div class="det num ' + cls(s.pnl) + '">' + pct(s.pnl_pct) + "</div></div>";
    h += '<div class="card kpi"><div class="lbl">Investito</div><div class="val num">' + money(s.invested) + '</div><div class="det num" style="color:var(--muted)">costo ' + money(s.cost) + "</div></div>";
    h += '<div class="card kpi"><div class="lbl">Liquidità</div><div class="val num">' + money(s.cash) + '</div><div class="det" style="color:var(--muted)">' + (s.total ? num(s.cash / s.total * 100, 1) + "% del conto" : "") + "</div></div>";
    h += '<div class="card kpi"><div class="lbl">Realizzato ' + esc((s.date || "").slice(0, 4)) + '</div><div class="val num ' + cls(s.realized_year) + '">' + smoney(s.realized_year) + '</div><div class="det num" style="color:var(--muted)">dividendi ' + money(s.dividends_year) + "</div></div>";
    h += "</div>";

    h += '<div class="card"><h2>Allocazione</h2><div class="alloc">' + donut(cats) + '<div class="legend">';
    Object.keys(cats).forEach(function (n) {
      var c = cats[n], hasT = c.target != null;
      var max = Math.max(100, c.weight, hasT ? c.target : 0);
      h += '<div class="lg"><i class="sw" style="background:' + catColor[n] + '"></i><span class="nm">' + esc(n) + '</span><span class="num">' + num(c.weight, 1) + "%</span>" +
        '<div class="bar"><i style="width:' + (c.weight / max * 100) + "%;background:" + catColor[n] + '"></i>' + (hasT ? '<u style="left:calc(' + (c.target / max * 100) + '% - 1px)"></u>' : "") + "</div>" +
        (hasT ? '<span class="tg">obiettivo ' + num(c.target, 0) + "% · " + (Math.abs(c.deviation) < 0.05 ? "in linea" : '<span class="' + (Math.abs(c.deviation) >= 5 ? "down" : "") + '">' + pct(c.deviation, 1).replace("%", " punti") + "</span>") + "</span>" : "") +
        "</div>";
    });
    h += "</div></div></div>";

    h += '<div class="card"><h2>Per categoria</h2><div class="list">';
    Object.keys(cats).forEach(function (n) {
      var c = cats[n];
      h += '<button type="button" class="item" data-goto="assets"><span><span class="sym" style="display:inline-flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:' + catColor[n] + '"></i>' + esc(n) + '</span><div class="nm">' + esc(c.symbols.join(" · ")) + '</div></span>' +
        '<span class="r"><div class="num">' + money(c.value) + '</div><div class="pct num ' + cls(c.pnl) + '">' + smoney(c.pnl) + " · " + pct(c.pnl_pct) + "</div></span></button>";
    });
    h += "</div></div>";
    return '<div class="home">' + h + "</div>";
  }

  // ---------------------------------------------------------------- titoli
  function viewAssets() {
    var s = D.summary, h = "";
    Object.keys(s.categories).forEach(function (n) {
      var c = s.categories[n];
      h += '<div class="group card"><div class="ghead"><span class="t"><i style="background:' + catColor[n] + '"></i>' + esc(n) + '</span><span class="s num">' + num(c.weight, 1) + "% · " + money(c.value) + "</span></div><div class=\"list\">";
      s.positions.filter(function (r) { return r.category === n; }).forEach(function (r) {
        var p = D.posBy[r.conid] || {};
        var ds = asset(r.conid).descrizione;
        h += '<button type="button" class="item" data-asset="' + esc(r.conid) + '"><span><span class="sym">' + esc(r.symbol) + '</span><div class="nm">' + esc(niceName(r.conid)) + '</div><div class="nm num">' + qty(p.qty) + " × " + money(p.mark, p.currency) + "</div></span>" +
          '<span class="r"><div class="num">' + money(r.value) + '</div><div class="pct num ' + cls(r.pnl) + '">' + smoney(r.pnl) + " · " + pct(r.pnl_pct) + "</div></span>" +
          (ds ? '<span class="ds">' + esc(ds) + "</span>" : "") + "</button>";
      });
      h += "</div></div>";
    });
    return '<div class="groups">' + h + "</div>";
  }

  // ---------------------------------------------------------------- dettaglio di un titolo
  function viewAsset(conid) {
    var i = ins(conid), a = asset(conid), p = D.posBy[conid], h = "";
    var row = (D.summary.positions || []).filter(function (r) { return r.conid === conid; })[0];
    h += backBtn();
    h += '<div class="detail"><div class="dhead"><h1>' + esc(i.symbol || "") + '</h1><div class="sub">' + esc(niceName(conid)) + "</div>";
    h += '<div class="chips">' + [a.categoria, i.isin, i.exchange, i.currency].filter(Boolean).map(function (x) { return '<span class="chip">' + esc(x) + "</span>"; }).join("") + "</div>";
    if (a.descrizione) h += '<p class="desc">' + esc(a.descrizione) + "</p>";
    h += '</div><div class="dcol">';
    if (p) {
      var cur = p.currency, fx = p.fx || 1, base = cur !== CUR;
      h += '<div class="card o1"><h2>Posizione</h2><div class="grid2">' +
        cell("Quantità", qty(p.qty)) +
        cell("Peso sull'investito", row && D.summary.invested ? num(row.value / D.summary.invested * 100, 1) + "%" : "–") +
        cell("Prezzo medio di carico", money(p.avg_price, cur, 4)) +
        cell("Prezzo di mercato", money(p.mark, cur, 4)) +
        cell("Valore", money(p.value, cur) + (base ? '<div class="sub">' + money(p.value * fx) + "</div>" : "")) +
        cell("Costo", money(p.cost, cur) + (base ? '<div class="sub">' + money(p.cost * fx) + "</div>" : "")) +
        cell("P&amp;L non realizzato", '<span class="' + cls(p.pnl) + '">' + smoney(p.pnl, cur) + "</span>" + (base ? '<div class="sub ' + cls(p.pnl) + '">' + smoney(p.pnl * fx) + "</div>" : "")) +
        cell("Rendimento", '<span class="' + cls(p.pnl) + '">' + pct(p.cost ? p.pnl / p.cost * 100 : 0) + "</span>") +
        "</div>" + (base ? '<div class="sub" style="margin-top:8px">Valori in ' + esc(cur) + "; sotto, in " + esc(CUR) + " al cambio del " + dmy(p.date) + ".</div>" : "") + "</div>";
    } else {
      h += '<div class="msg o1">Nessuna posizione aperta su questo titolo.</div>';
    }
    var facts = [["Nome", a.nome || i.description], ["Indice", a.indice], ["TER", a.ter != null ? num(a.ter, 2) + "%" : null], ["Dividendi", a.dividendi],
      ["Replica", a.replica], ["Emittente", a.emittente], ["Domicilio", a.domicilio], ["ISIN", i.isin], ["Borsa", i.exchange], ["Tipo", [i.asset, i.sub].filter(Boolean).join(" · ")], ["Note", a.note]];
    h += '<div class="card o3"><h2>Scheda</h2><dl class="facts">' + facts.filter(function (f) { return f[1]; }).map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + esc(f[1]) + "</dd>"; }).join("") + "</dl></div>";
    h += '</div><div class="dcol">';
    h += '<div class="card o2"><h2>Prezzi delle operazioni</h2><svg class="chart" id="achart" height="190"></svg><div class="tip" id="atip"></div></div>';
    var trs = D.tradeList.filter(function (t) { return t.conid === conid; });
    h += '<div class="card o4"><h2>Operazioni (' + trs.length + ")</h2>" + tradesHtml(trs, false) + "</div>";
    return h + "</div></div>";
  }
  function cell(l, v) { return '<div><div class="lbl">' + l + '</div><div class="v num">' + v + "</div></div>"; }

  function tradesHtml(list, withSym) {
    if (!list.length) return '<div class="sub">Nessuna operazione in archivio.</div>';
    var h = '<div class="trs">', month = "";
    list.forEach(function (t) {
      var m = t.date.slice(0, 7);
      if (withSym && m !== month) { month = m; h += '<div class="month">' + MONTHS_L[+m.slice(5, 7) - 1] + " " + m.slice(0, 4) + "</div>"; }
      var buy = t.side === "BUY";
      h += '<div class="tr"><span class="d num">' + dmy(t.date) + '</span><span class="side ' + (buy ? "up" : "down") + '">' + (buy ? "ACQ" : "VEN") + "</span>" +
        '<span class="q num">' + (withSym ? '<b style="font-family:var(--font-ui)">' + esc(t.symbol) + "</b> " : "") + qty(Math.abs(t.qty)) + " × " + money(t.price, t.currency, 4) + "</span>" +
        '<span class="tot num">' + money(Math.abs(t.proceeds), t.currency) + "</span>" +
        '<span class="x num">comm. ' + money(Math.abs(t.commission), t.commission_currency || t.currency) + (t.realized ? ' · realizzato <span class="' + cls(t.realized) + '">' + smoney(t.realized, t.currency) + "</span>" : "") + "</span></div>";
    });
    return h + "</div>";
  }

  // ---------------------------------------------------------------- operazioni
  function viewTrades() {
    var syms = {}; D.tradeList.forEach(function (t) { syms[t.symbol] = 1; });
    var h = '<div class="chips" style="margin:0 0 4px"><button type="button" class="chip" data-filter="" aria-pressed="' + (!state.filter) + '">Tutte</button>';
    Object.keys(syms).sort().forEach(function (s) { h += '<button type="button" class="chip" data-filter="' + esc(s) + '" aria-pressed="' + (state.filter === s) + '">' + esc(s) + "</button>"; });
    h += "</div>";
    var list = D.tradeList.filter(function (t) { return !state.filter || t.symbol === state.filter; });
    var buys = list.filter(function (t) { return t.side === "BUY"; }).length;
    var sells = list.length - buys;
    h += '<div class="sub">' + list.length + (list.length === 1 ? " operazione · " : " operazioni · ") + buys + (buys === 1 ? " acquisto · " : " acquisti · ") +
      sells + (sells === 1 ? " vendita" : " vendite") + "</div>";
    return h + '<div class="card">' + tradesHtml(list, true) + "</div>";
  }

  // ---------------------------------------------------------------- storico
  var RANGES = [["1M", 31], ["3M", 92], ["6M", 183], ["1A", 366], ["Tutto", 1e6]];
  function navSeries() {
    var dates = Object.keys(D.nav || {}).sort(), last = dates[dates.length - 1];
    if (!last) return [];
    var days = RANGES.filter(function (r) { return r[0] === state.range; })[0][1];
    var from = new Date(Date.parse(last) - days * 864e5).toISOString().slice(0, 10);
    return dates.filter(function (d) { return d >= from; }).map(function (d) { return { d: d, v: D.nav[d].total, c: D.nav[d].cash }; });
  }
  function viewHistory() {
    var h = '<div class="card"><h2>Valore del conto</h2><div class="ranges">';
    RANGES.forEach(function (r) { h += '<button type="button" class="chip" data-range="' + r[0] + '" aria-pressed="' + (state.range === r[0]) + '">' + r[0] + "</button>"; });
    h += '</div><div class="tip" id="ntip"></div><svg class="chart" id="nchart" height="230"></svg></div>';
    var c = D.change_in_nav;
    if (c) {
      h += '<div class="card"><h2>Dal ' + dmy(c.from_) + " al " + dmy(c.to) + '</h2><dl class="facts">' +
        fact("Valore iniziale", money(c.startingValue)) + fact("Variazione di mercato", smoney(c.mtm), c.mtm) +
        fact("Versamenti e prelievi", smoney(c.depositsWithdrawals)) + fact("Dividendi", smoney(c.dividends), c.dividends) +
        fact("Interessi", smoney(c.interest), c.interest) + fact("Commissioni", smoney(c.commissions), c.commissions) +
        fact("Ritenute", smoney(c.withholdingTax), c.withholdingTax) + fact("Valore finale", money(c.endingValue)) +
        fact("Rendimento (TWR)", pct(c.twr), c.twr) + "</dl></div>";
    }
    return '<div class="hist">' + h + "</div>";
  }
  function wide() { return window.innerWidth >= 900; }
  function fact(l, v, sign) { return "<dt>" + l + '</dt><dd class="num ' + (sign != null ? cls(sign) : "") + '">' + v + "</dd>"; }

  // ---------------------------------------------------------------- grafici SVG
  function niceTicks(lo, hi, n) {
    var span = hi - lo || Math.abs(hi) || 1, step = Math.pow(10, Math.floor(Math.log10(span / n))), err = span / n / step;
    step *= err >= 7.5 ? 10 : err >= 3 ? 5 : err >= 1.5 ? 2 : 1;
    var out = []; for (var v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
    return out;
  }
  function frame(svg, lo, hi, fmt) {
    var W = svg.clientWidth || 320, H = +svg.getAttribute("height"), L = 8, R = 56, T = 10, B = 22;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.02 || 1; lo -= pad; hi += pad;
    var y = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
    var g = "";
    niceTicks(lo, hi, 4).forEach(function (v) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + tok("--line") + '" stroke-width="1"/>' +
        '<text x="' + (W - R + 6) + '" y="' + (y(v) + 4) + '">' + esc(fmt(v)) + "</text>";
    });
    return { W: W, H: H, L: L, R: R, T: T, B: B, y: y, grid: g };
  }
  function short(v) { return Math.abs(v) >= 1e4 ? num(v / 1e3, 1) + "k" : num(v, Math.abs(v) < 10 ? 2 : 0); }

  function drawNav() {
    var svg = $("nchart"), s = navSeries(), tip = $("ntip");
    svg.setAttribute("height", wide() ? Math.max(320, Math.min(520, window.innerHeight - 260)) : 230);
    if (s.length < 2) { svg.outerHTML = '<div class="sub">Servono almeno due giorni di dati.</div>'; return; }
    var vals = s.map(function (p) { return p.v; }), f = frame(svg, Math.min.apply(null, vals), Math.max.apply(null, vals), short);
    var t0 = Date.parse(s[0].d), t1 = Date.parse(s[s.length - 1].d);
    var x = function (d) { return f.L + (Date.parse(d) - t0) / ((t1 - t0) || 1) * (f.W - f.L - f.R); };
    var line = s.map(function (p, i) { return (i ? "L" : "M") + x(p.d).toFixed(1) + " " + f.y(p.v).toFixed(1); }).join(" ");
    var area = line + " L" + x(s[s.length - 1].d).toFixed(1) + " " + (f.H - f.B) + " L" + x(s[0].d).toFixed(1) + " " + (f.H - f.B) + " Z";
    var ch = vals[vals.length - 1] - vals[0], col = tok(ch >= 0 ? "--up" : "--down");
    var labels = "", step = Math.max(1, Math.floor(s.length / 4));
    for (var i = 0; i < s.length; i += step) labels += '<text x="' + x(s[i].d) + '" y="' + (f.H - 6) + '" text-anchor="' + (i === 0 ? "start" : "middle") + '">' + dm(s[i].d) + "</text>";
    svg.innerHTML = f.grid + '<path d="' + area + '" fill="' + col + '" fill-opacity="0.10"/><path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>' +
      labels + '<line id="ncur" y1="' + f.T + '" y2="' + (f.H - f.B) + '" stroke="' + tok("--muted") + '" stroke-dasharray="3 3" visibility="hidden"/><circle id="ndot" r="4" fill="' + col + '" visibility="hidden"/>';
    var base = "dal " + dmy(s[0].d) + ': <b class="num ' + cls(ch) + '">' + smoney(ch) + " (" + pct(vals[0] ? ch / vals[0] * 100 : 0) + ")</b>";
    tip.innerHTML = base;
    function at(ev) {
      var r = svg.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      var k = 0, best = 1e9; s.forEach(function (p, i) { var d = Math.abs(x(p.d) - px * f.W / r.width); if (d < best) { best = d; k = i; } });
      var p = s[k]; $("ncur").setAttribute("x1", x(p.d)); $("ncur").setAttribute("x2", x(p.d)); $("ncur").setAttribute("visibility", "visible");
      $("ndot").setAttribute("cx", x(p.d)); $("ndot").setAttribute("cy", f.y(p.v)); $("ndot").setAttribute("visibility", "visible");
      tip.innerHTML = dmy(p.d) + ': <b class="num">' + money(p.v) + "</b> · liquidità " + money(p.c);
    }
    function out() { $("ncur").setAttribute("visibility", "hidden"); $("ndot").setAttribute("visibility", "hidden"); tip.innerHTML = base; }
    svg.addEventListener("pointermove", at); svg.addEventListener("pointerdown", at); svg.addEventListener("pointerleave", out);
  }

  function drawAssetChart(conid) {
    var svg = $("achart"), tip = $("atip"), p = D.posBy[conid];
    svg.setAttribute("height", wide() ? 300 : 190);
    var trs = D.tradeList.filter(function (t) { return t.conid === conid; }).slice().reverse();
    var snaps = Object.keys(D.snapshots || {}).sort().filter(function (d) { return D.snapshots[d][conid]; })
      .map(function (d) { return { d: d, v: D.snapshots[d][conid][1] }; });
    if (!trs.length && snaps.length < 2) { svg.outerHTML = '<div class="sub">Nessun dato da mostrare.</div>'; return; }
    var pts = trs.map(function (t) { return t.price; }).concat(snaps.map(function (s) { return s.v; }));
    if (p) pts.push(p.avg_price, p.mark);
    var f = frame(svg, Math.min.apply(null, pts), Math.max.apply(null, pts), short);
    var dates = trs.map(function (t) { return t.date; }).concat(snaps.map(function (s) { return s.d; }));
    if (p && p.date) dates.push(p.date);
    dates.sort();
    var t0 = Date.parse(dates[0]), t1 = Date.parse(dates[dates.length - 1]);
    if (t1 - t0 < 864e5 * 7) { t0 -= 864e5 * 3; t1 += 864e5 * 3; }
    var x = function (d) { return f.L + 6 + (Date.parse(d) - t0) / ((t1 - t0) || 1) * (f.W - f.L - f.R - 12); };
    var g = f.grid;
    if (p) {
      g += '<line x1="' + f.L + '" x2="' + (f.W - f.R) + '" y1="' + f.y(p.avg_price) + '" y2="' + f.y(p.avg_price) + '" stroke="' + tok("--fg") + '" stroke-width="1.2" stroke-dasharray="5 4"/>';
      g += '<line x1="' + f.L + '" x2="' + (f.W - f.R) + '" y1="' + f.y(p.mark) + '" y2="' + f.y(p.mark) + '" stroke="' + tok("--accent") + '" stroke-width="1.5"/>';
    }
    if (snaps.length > 1) g += '<path fill="none" stroke="' + tok("--accent") + '" stroke-width="2" d="' + snaps.map(function (s, i) { return (i ? "L" : "M") + x(s.d) + " " + f.y(s.v); }).join(" ") + '"/>';
    trs.forEach(function (t, i) {
      var buy = t.side === "BUY", cx = x(t.date), cy = f.y(t.price);
      g += buy ? '<path data-i="' + i + '" d="M' + cx + " " + (cy - 6) + " L" + (cx + 6) + " " + (cy + 5) + " L" + (cx - 6) + " " + (cy + 5) + ' Z" fill="' + tok("--up") + '"/>'
               : '<path data-i="' + i + '" d="M' + cx + " " + (cy + 6) + " L" + (cx + 6) + " " + (cy - 5) + " L" + (cx - 6) + " " + (cy - 5) + ' Z" fill="' + tok("--down") + '"/>';
    });
    g += '<text x="' + (f.L + 4) + '" y="' + (f.H - 6) + '">' + dm(new Date(t0).toISOString().slice(0, 10)) + '</text><text x="' + (f.W - f.R) + '" y="' + (f.H - 6) + '" text-anchor="end">' + dm(new Date(t1).toISOString().slice(0, 10)) + "</text>";
    svg.innerHTML = g;
    var cur = p ? p.currency : (trs[0] || {}).currency;
    var base = (p ? '<span style="color:var(--accent)">━</span> prezzo ' + money(p.mark, cur, 2) + ' &nbsp;<span>┅</span> medio ' + money(p.avg_price, cur, 2) + " &nbsp;" : "") +
      '<span class="up">▲</span> acquisti <span class="down">▼</span> vendite';
    tip.innerHTML = base;
    svg.addEventListener("pointerdown", function (ev) {
      var r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * f.W / r.width, k = -1, best = 1e9;
      trs.forEach(function (t, i) { var d = Math.abs(x(t.date) - px); if (d < best) { best = d; k = i; } });
      if (k < 0 || best > 24) { tip.innerHTML = base; return; }
      var t = trs[k];
      tip.innerHTML = dmy(t.date) + ' · <b class="' + (t.side === "BUY" ? "up" : "down") + '">' + (t.side === "BUY" ? "acquisto" : "vendita") + "</b> " + qty(Math.abs(t.qty)) + " × <b class=\"num\">" + money(t.price, t.currency, 4) + "</b>";
    });
  }

  // ---------------------------------------------------------------- schermo intero
  // In Telegram dalla Bot API 8.0 (requestFullscreen, anche su PC e tablet); fuori da Telegram lo schermo intero del
  // browser dove c'e' (non su Safari dell'iPhone). Dove non si puo', il pulsante non compare. La Mini App si apre
  // sempre nella sua finestra: lo schermo intero solo col pulsante, quando lo si vuole.
  var ICON_IN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>';
  var ICON_OUT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg>';
  function setupFullscreen() {
    var b = $("fs");
    var tgFs = inTg && typeof tg.requestFullscreen === "function" && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0");
    var docFs = !inTg && document.fullscreenEnabled && typeof root.requestFullscreen === "function";
    if (!tgFs && !docFs) return;
    function isFs() { return tgFs ? !!tg.isFullscreen : !!document.fullscreenElement; }
    function show() {
      var on = isFs();
      b.innerHTML = on ? ICON_OUT : ICON_IN;
      b.title = on ? "Esci dallo schermo intero" : "Schermo intero";
      b.setAttribute("aria-label", b.title);
      setTimeout(function () { if (D) render(); }, 80);
    }
    b.addEventListener("click", function () {
      try {
        if (tgFs) { if (isFs()) tg.exitFullscreen(); else tg.requestFullscreen(); }
        else if (isFs()) document.exitFullscreen();
        else root.requestFullscreen().catch(function () {});
      } catch (e) {}
    });
    if (tgFs) {
      tg.onEvent("fullscreenChanged", show);
      tg.onEvent("fullscreenFailed", function (e) { if (e && e.error === "UNSUPPORTED") b.hidden = true; });
    } else {
      document.addEventListener("fullscreenchange", show);
    }
    b.hidden = false;
    show();
  }

  // ---------------------------------------------------------------- avvio
  function start(data) {
    D = data;
    if (!D.summary) throw new Error("archivio senza riepilogo: esegui 'python -m phub run'");
    prep();
    $("msg").hidden = true;
    var sv = SERVICES.filter(function (x) { return x.id === params().s; })[0];   // #...&s=portfolio apre il servizio
    state.view = sv ? sv.view : "hub";
    history.replaceState({ view: state.view }, "");
    render();
    setupFullscreen();
    loadedAt = Date.now();
  }

  // ---------------------------------------------------------------- rilettura
  // Una Mini App lasciata aperta (finestra sul PC, ridotta sul telefono) non sa che l'archivio e' cambiato: quando
  // si torna a guardarla, se l'ultima lettura ha piu' di 30 minuti la rilegge, restando sulla schermata in corso.
  var REFRESH_MS = 30 * 60 * 1000, loadedAt = 0, refreshing = false;
  function refresh() {
    if (!D || refreshing || document.visibilityState === "hidden" || Date.now() - loadedAt < REFRESH_MS) return;
    refreshing = true;
    load().then(function (data) {
      if (!data || !data.summary) throw new Error("archivio senza riepilogo");
      D = data; catColor = {};
      prep();
      render();
      loadedAt = Date.now();
    }).catch(function () {
      loadedAt = Date.now() - REFRESH_MS + 60 * 1000;          // rete assente o GitHub occupato: si riprova tra un minuto
    }).then(function () { refreshing = false; });
  }
  document.addEventListener("visibilitychange", refresh);
  window.addEventListener("focus", refresh);
  if (inTg) { try { tg.onEvent("activated", refresh); } catch (e) {} }   // Mini App ripresa dalla barra (Bot API 8.0)

  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
    msg("Questo browser non sa decifrare i dati: aggiorna Telegram o il browser.", true);
    return;
  }
  window.addEventListener("hashchange", function () { location.reload(); });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (D) render(); }, 150); });
  load().then(start).catch(function (e) {
    var m = e && e.message ? e.message : String(e);
    if (m === "NOLINK") msg('Apri il portafoglio dal pulsante del bot Telegram. Vuoi vedere com\'è fatto? <a href="#demo">Apri i dati di prova</a>.');
    else msg("Dati non disponibili: " + esc(m), true);
  });
})();
</script>
</body>
