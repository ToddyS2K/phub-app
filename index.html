<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PHub Portafoglio</title>
<!--
  PHub - Mini App di Telegram (Fase 2, 16/11/2026). Pagina statica per GitHub Pages (repository phub-app).
  Nessun dato qui: l'archivio cifrato sta in un gist segreto e si decifra nel browser.

  Il frammento dell'indirizzo (dopo #, non arriva a nessun server) porta: g = gist, k = chiave (32 byte, base64url),
  f = file nel gist (facoltativo). In alternativa u = indirizzo di un file cifrato; #demo apre i dati di prova.
  Formato FL1, lo stesso di phub/crypto.py e del grafico di FL444: "FL1" + nonce (16) + tag (32) + dati, in base64;
  tag HMAC-SHA256 su nonce + dati, keystream HMAC-SHA256(nonce || contatore), chiavi HMAC(k, "enc"/"mac"); poi zlib.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #eef2f5; --surface: #ffffff; --fg: #15202b; --muted: #5b6977; --line: #d6dee5; --accent: #2b7bc9;
  --up: #1e9a68; --down: #cf4556; --track: #e3e9ee; --err: #b42318;
  --c1: #2b7bc9; --c2: #1e9a68; --c3: #dd7a17; --c4: #6d4fd1; --c5: #c99a0e; --c6: #cf4556; --c7: #0e9aa7; --c8: #8794a1;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1621; --surface: #17212b; --fg: #e4ebf2; --muted: #8a9aab; --line: #263444; --accent: #5ea8f2;
  --up: #3dbb87; --down: #ee6a79; --track: #223040; --err: #f2545b;
  --c1: #5ea8f2; --c2: #3dbb87; --c3: #f0954a; --c4: #a58cf5; --c5: #e2b63a; --c6: #ee6a79; --c7: #34c3cf; --c8: #7c8b9b;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1621; --surface: #17212b; --fg: #e4ebf2; --muted: #8a9aab; --line: #263444; --accent: #5ea8f2;
  --up: #3dbb87; --down: #ee6a79; --track: #223040; --err: #f2545b;
  --c1: #5ea8f2; --c2: #3dbb87; --c3: #f0954a; --c4: #a58cf5; --c5: #e2b63a; --c6: #ee6a79; --c7: #34c3cf; --c8: #7c8b9b;
  color-scheme: dark }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--font-ui); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  padding-bottom: calc(24px + var(--tg-safe-area-inset-bottom, 0px)); }
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
h1 { font-size: 19px; font-weight: 600; margin: 0; }
h2 { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.msg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; color: var(--muted); }
.msg.err { color: var(--err); border-color: var(--err); }
.msg a { color: var(--accent); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

nav.tabs { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: var(--bg); padding: 4px 0 8px; }
nav.tabs button { padding: 8px 4px; border-radius: 8px; font-size: 13.5px; color: var(--muted); border: 1px solid transparent; }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); font-weight: 600; border-color: var(--line); }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi .lbl { font-size: 12px; color: var(--muted); }
.kpi .val { font-size: 20px; font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .det { font-size: 12.5px; margin-top: 2px; }
.kpi.big { grid-column: 1 / -1; }
.kpi.big .val { font-size: 28px; }
.minis { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.minis b { color: var(--fg); font-weight: 500; }

.alloc { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: center; }
.donut { width: 150px; height: 150px; }
.legend { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lg { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; font-size: 13.5px; }
.lg .sw { width: 10px; height: 10px; border-radius: 3px; }
.lg .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg .bar { grid-column: 2 / -1; height: 5px; border-radius: 3px; background: var(--track); position: relative; }
.lg .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.lg .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); border-radius: 1px; }
.lg .tg { grid-column: 2 / -1; font-size: 11.5px; color: var(--muted); }
@media (max-width: 430px) { .alloc { grid-template-columns: 1fr; justify-items: center; } .legend { width: 100%; } }

.group { margin-top: 4px; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 2px 6px; }
.ghead .t { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.ghead .t i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ghead .s { font-size: 12.5px; color: var(--muted); }
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; width: 100%; text-align: left;
  padding: 10px 2px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .sym { font-weight: 600; }
.item .nm { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .r { text-align: right; }
.item .r .pct { font-size: 12.5px; }

.back { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 14px; padding: 4px 0; }
.dhead h1 { font-size: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
button.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.grid2 .lbl { font-size: 12px; color: var(--muted); }
.grid2 .v { font-size: 15.5px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }

.trs { display: flex; flex-direction: column; }
.tr { display: grid; grid-template-columns: 5.6em 3.6em minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline;
  padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.tr:first-child { border-top: 0; }
.tr .d { color: var(--muted); font-size: 12.5px; }
.tr .side { font-weight: 600; font-size: 12px; }
.tr .q { min-width: 0; }
.tr .tot { text-align: right; }
.tr .x { grid-column: 3 / -1; font-size: 12px; color: var(--muted); }
.month { font-size: 12px; color: var(--muted); font-weight: 600; padding: 12px 0 2px; text-transform: capitalize; }

.chart { width: 100%; display: block; touch-action: pan-y; }
.chart text { font-family: var(--font-num); font-size: 11px; fill: var(--muted); }
.ranges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tip { font-size: 13px; min-height: 1.4em; color: var(--muted); }
.tip b { color: var(--fg); font-weight: 500; }
footer { font-size: 12px; color: var(--muted); text-align: center; padding-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Portafoglio</h1>
    <span class="sub" id="sub"></span>
  </header>
  <div class="msg" id="msg">Carico i dati…</div>
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button type="button" role="tab" data-view="home" aria-selected="true">Panoramica</button>
    <button type="button" role="tab" data-view="assets" aria-selected="false">Titoli</button>
    <button type="button" role="tab" data-view="trades" aria-selected="false">Operazioni</button>
    <button type="button" role="tab" data-view="history" aria-selected="false">Storico</button>
  </nav>
  <main id="view"></main>
  <footer id="foot" hidden></footer>
</div>

<script>
(function () {
  "use strict";
  var DEMO_KEY = "cGh1Yi1kZW1vLWtleS1vbmx5LWZvci1kZW1vLWRhdGE";   // solo per i dati di prova pubblici (demo.txt)
  var root = document.documentElement;
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.initData);
  if (inTg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    var setTheme = function () { if (tg.colorScheme) root.setAttribute("data-theme", tg.colorScheme); };
    setTheme();
    try { tg.onEvent("themeChanged", function () { setTheme(); rerender(); }); } catch (e) {}
  }
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { rerender(); }); } catch (e) {}

  // ---------------------------------------------------------------- utilita'
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function tok(n) { return getComputedStyle(root).getPropertyValue(n).trim(); }
  var CUR = "EUR";
  function money(x, cur, dec) {
    if (x == null || isNaN(x)) return "–";
    try { return Number(x).toLocaleString("it-IT", { style: "currency", currency: cur || CUR, minimumFractionDigits: dec == null ? 2 : dec, maximumFractionDigits: dec == null ? 2 : dec }); }
    catch (e) { return num(x, 2) + " " + (cur || CUR); }
  }
  function smoney(x, cur) { return x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + money(Math.abs(x), cur); }
  function num(x, dec) { return Number(x).toLocaleString("it-IT", { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
  function qty(x) { return Number(x).toLocaleString("it-IT", { maximumFractionDigits: 4 }); }
  function pct(x, dec) { return x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + num(Math.abs(x), dec == null ? 2 : dec) + "%"; }
  function cls(x) { return x > 0 ? "up" : x < 0 ? "down" : ""; }
  var MONTHS = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
  var MONTHS_L = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
  function dmy(d) { return d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "–"; }
  function dm(d) { return d.slice(8, 10) + " " + MONTHS[+d.slice(5, 7) - 1]; }
  function msg(text, err) { var m = $("msg"); m.innerHTML = text; m.className = "msg" + (err ? " err" : ""); m.hidden = false; }

  // ---------------------------------------------------------------- dati: gist o file, poi decifratura
  function params() {
    var out = {};
    location.hash.replace(/^#/, "").split("&").forEach(function (p) {
      var i = p.indexOf("=");
      if (i > 0) out[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); else if (p) out[p] = "";
    });
    return out;
  }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64url(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return b64(s); }
  function utf8(s) { return new TextEncoder().encode(s); }
  async function hkey(raw) { return crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"]); }
  async function hsign(key, data) { return new Uint8Array(await crypto.subtle.sign("HMAC", key, data)); }

  async function decrypt(blob, k) {
    var raw = b64(blob.trim());
    if (raw[0] !== 70 || raw[1] !== 76 || raw[2] !== 49) throw new Error("formato dei dati sconosciuto");
    var nonce = raw.slice(3, 19), tag = raw.slice(19, 51), ct = raw.slice(51);
    var key = await hkey(b64url(k));
    var ke = await hkey(await hsign(key, utf8("enc"))), km = await hkey(await hsign(key, utf8("mac")));
    var mac = new Uint8Array(nonce.length + ct.length); mac.set(nonce); mac.set(ct, nonce.length);
    if (!(await crypto.subtle.verify("HMAC", km, tag, mac))) throw new Error("chiave sbagliata o dati alterati");
    var n = Math.ceil(ct.length / 32), jobs = [];
    for (var i = 0; i < n; i++) {
      var c = new Uint8Array(20); c.set(nonce); new DataView(c.buffer).setUint32(16, i, false);
      jobs.push(hsign(ke, c));
    }
    var ks = await Promise.all(jobs), out = new Uint8Array(ct.length);
    for (var j = 0; j < ct.length; j++) out[j] = ct[j] ^ ks[j >> 5][j & 31];
    var txt = await new Response(new Blob([out]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
    return JSON.parse(txt);
  }

  async function load() {
    var p = params();
    if ("demo" in p) { p.u = "demo.txt"; p.k = DEMO_KEY; DEMO = true; }
    if (p.g && p.k) {
      var r = await fetch("https://api.github.com/gists/" + encodeURIComponent(p.g), { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" });
      if (r.status === 403 || r.status === 429) throw new Error("GitHub limita le richieste da questa rete: riprova tra qualche minuto");
      if (!r.ok) throw new Error(r.status === 404 ? "archivio non trovato su GitHub" : "GitHub ha risposto " + r.status);
      var j = await r.json(), f = j.files[p.f || "phub_archivio.txt"] || j.files[Object.keys(j.files)[0]];
      if (!f) throw new Error("file dell'archivio assente nel gist");
      var content = f.truncated ? await (await fetch(f.raw_url, { cache: "no-store" })).text() : f.content;
      return decrypt(content, p.k);
    }
    if (p.u && p.k) return decrypt(await (await fetch(p.u, { cache: "no-store" })).text(), p.k);
    throw new Error("NOLINK");
  }

  // ---------------------------------------------------------------- stato e navigazione
  var D = null, DEMO = false, state = { view: "home", conid: null, filter: "", range: "1A" };
  var COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c7"];
  var catColor = {};

  function prep() {
    CUR = D.base_currency || (D.summary && D.summary.currency) || "EUR";
    var names = Object.keys(D.summary.categories), i = 0;
    names.forEach(function (n) {
      var c = (D.categories[n] || {}).color;
      catColor[n] = c ? c : (n === "Da assegnare" ? tok("--c8") : tok(COLORS[i++ % COLORS.length]));
    });
    D.posBy = {}; (D.positions || []).forEach(function (p) { D.posBy[p.conid] = p; });
    D.tradeList = Object.keys(D.trades || {}).map(function (id) { var t = D.trades[id]; t.id = id; return t; })
      .sort(function (a, b) { return (b.date + b.time).localeCompare(a.date + a.time); });
  }
  function ins(conid) { return (D.instruments || {})[conid] || {}; }
  function asset(conid) { return (D.assets || {})[conid] || {}; }
  function niceName(conid) { var a = asset(conid), i = ins(conid); return a.nome || i.description || i.symbol || ""; }

  function go(view, conid, push) {
    state.view = view; state.conid = conid || null;
    if (push !== false) history.pushState({ view: view, conid: state.conid }, "");
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", function (e) {
    var s = e.state || { view: "home" };
    state.view = s.view; state.conid = s.conid || null; render();
  });
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-view]"); if (b) go(b.getAttribute("data-view"));
  });
  $("view").addEventListener("click", function (e) {
    var a = e.target.closest("[data-asset]"); if (a) { go("asset", a.getAttribute("data-asset")); return; }
    var gt = e.target.closest("[data-goto]"); if (gt) { go(gt.getAttribute("data-goto")); return; }
    var bk = e.target.closest("[data-back]"); if (bk) { history.back(); return; }
    var f = e.target.closest("[data-filter]"); if (f) { state.filter = f.getAttribute("data-filter"); render(); return; }
    var r = e.target.closest("[data-range]"); if (r) { state.range = r.getAttribute("data-range"); render(); }
  });

  function backButton(show) {
    if (!inTg || !tg.BackButton) return;
    try { if (show) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {}
  }
  if (inTg && tg.BackButton) { try { tg.BackButton.onClick(function () { history.back(); }); } catch (e) {} }

  function rerender() { if (D) { var ci = 0; Object.keys(catColor).forEach(function (n) { if (!(D.categories[n] || {}).color) catColor[n] = n === "Da assegnare" ? tok("--c8") : tok(COLORS[ci++ % COLORS.length]); }); render(); } }

  function render() {
    var v = state.view;
    $("tabs").hidden = v === "asset";
    Array.prototype.forEach.call($("tabs").children, function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-view") === v)); });
    backButton(v === "asset");
    var html = v === "assets" ? viewAssets() : v === "trades" ? viewTrades() : v === "history" ? viewHistory()
      : v === "asset" ? viewAsset(state.conid) : viewHome();
    $("view").innerHTML = html;
    if (v === "history") drawNav();
    if (v === "asset") drawAssetChart(state.conid);
  }

  // ---------------------------------------------------------------- panoramica
  function donut(cats) {
    var names = Object.keys(cats), R = 60, r = 40, cx = 75, cy = 75, a0 = -Math.PI / 2, out = "";
    var tot = names.reduce(function (s, n) { return s + cats[n].value; }, 0) || 1;
    names.forEach(function (n) {
      var frac = cats[n].value / tot, a1 = a0 + frac * Math.PI * 2;
      if (frac >= 0.9999) { out += '<circle cx="75" cy="75" r="50" fill="none" stroke="' + catColor[n] + '" stroke-width="20"/>'; return; }
      var gap = names.length > 1 ? 0.012 : 0, s = a0 + gap, e = a1 - gap, large = e - s > Math.PI ? 1 : 0;
      if (e > s) {
        out += '<path fill="' + catColor[n] + '" d="M' + (cx + R * Math.cos(s)) + " " + (cy + R * Math.sin(s)) +
          " A" + R + " " + R + " 0 " + large + " 1 " + (cx + R * Math.cos(e)) + " " + (cy + R * Math.sin(e)) +
          " L" + (cx + r * Math.cos(e)) + " " + (cy + r * Math.sin(e)) +
          " A" + r + " " + r + " 0 " + large + " 0 " + (cx + r * Math.cos(s)) + " " + (cy + r * Math.sin(s)) + ' Z"><title>' + esc(n) + "</title></path>";
      }
      a0 = a1;
    });
    return '<svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Allocazione per categoria">' + out +
      '<text x="75" y="72" text-anchor="middle" style="font: 500 11px var(--font-ui); fill: var(--muted)">investito</text>' +
      '<text x="75" y="89" text-anchor="middle" style="font: 500 13px var(--font-num); fill: var(--fg)">' + esc(money(D.summary.invested, CUR, 0)) + "</text></svg>";
  }

  function viewHome() {
    var s = D.summary, cats = s.categories, h = "";
    h += '<div class="kpis">';
    h += '<div class="card kpi big"><div class="lbl">Totale conto</div><div class="val num">' + money(s.total) + "</div>" +
      (s.day_change != null ? '<div class="det num ' + cls(s.day_change) + '">' + smoney(s.day_change) + " (" + pct(s.day_change_pct) + ') ultimo giorno</div>' : "") + "</div>";
    h += '<div class="card kpi"><div class="lbl">P&amp;L non realizzato</div><div class="val num ' + cls(s.pnl) + '">' + smoney(s.pnl) + '</div><div class="det num ' + cls(s.pnl) + '">' + pct(s.pnl_pct) + "</div></div>";
    h += '<div class="card kpi"><div class="lbl">Investito</div><div class="val num">' + money(s.invested) + '</div><div class="det num" style="color:var(--muted)">costo ' + money(s.cost) + "</div></div>";
    h += '<div class="card kpi"><div class="lbl">Liquidità</div><div class="val num">' + money(s.cash) + '</div><div class="det" style="color:var(--muted)">' + (s.total ? num(s.cash / s.total * 100, 1) + "% del conto" : "") + "</div></div>";
    h += '<div class="card kpi"><div class="lbl">Realizzato ' + esc((s.date || "").slice(0, 4)) + '</div><div class="val num ' + cls(s.realized_year) + '">' + smoney(s.realized_year) + '</div><div class="det num" style="color:var(--muted)">dividendi ' + money(s.dividends_year) + "</div></div>";
    h += "</div>";

    h += '<div class="card"><h2>Allocazione</h2><div class="alloc">' + donut(cats) + '<div class="legend">';
    Object.keys(cats).forEach(function (n) {
      var c = cats[n], hasT = c.target != null;
      var max = Math.max(100, c.weight, hasT ? c.target : 0);
      h += '<div class="lg"><i class="sw" style="background:' + catColor[n] + '"></i><span class="nm">' + esc(n) + '</span><span class="num">' + num(c.weight, 1) + "%</span>" +
        '<div class="bar"><i style="width:' + (c.weight / max * 100) + "%;background:" + catColor[n] + '"></i>' + (hasT ? '<u style="left:calc(' + (c.target / max * 100) + '% - 1px)"></u>' : "") + "</div>" +
        (hasT ? '<span class="tg">obiettivo ' + num(c.target, 0) + "% · " + (Math.abs(c.deviation) < 0.05 ? "in linea" : '<span class="' + (Math.abs(c.deviation) >= 5 ? "down" : "") + '">' + pct(c.deviation, 1).replace("%", " punti") + "</span>") + "</span>" : "") +
        "</div>";
    });
    h += "</div></div></div>";

    h += '<div class="card"><h2>Per categoria</h2><div class="list">';
    Object.keys(cats).forEach(function (n) {
      var c = cats[n];
      h += '<button type="button" class="item" data-goto="assets"><span><span class="sym" style="display:inline-flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:' + catColor[n] + '"></i>' + esc(n) + '</span><div class="nm">' + esc(c.symbols.join(" · ")) + '</div></span>' +
        '<span class="r"><div class="num">' + money(c.value) + '</div><div class="pct num ' + cls(c.pnl) + '">' + smoney(c.pnl) + " · " + pct(c.pnl_pct) + "</div></span></button>";
    });
    h += "</div></div>";
    return h;
  }

  // ---------------------------------------------------------------- titoli
  function viewAssets() {
    var s = D.summary, h = "";
    Object.keys(s.categories).forEach(function (n) {
      var c = s.categories[n];
      h += '<div class="group card"><div class="ghead"><span class="t"><i style="background:' + catColor[n] + '"></i>' + esc(n) + '</span><span class="s num">' + num(c.weight, 1) + "% · " + money(c.value) + "</span></div><div class=\"list\">";
      s.positions.filter(function (r) { return r.category === n; }).forEach(function (r) {
        var p = D.posBy[r.conid] || {};
        h += '<button type="button" class="item" data-asset="' + esc(r.conid) + '"><span><span class="sym">' + esc(r.symbol) + '</span><div class="nm">' + esc(niceName(r.conid)) + '</div><div class="nm num">' + qty(p.qty) + " × " + money(p.mark, p.currency) + "</div></span>" +
          '<span class="r"><div class="num">' + money(r.value) + '</div><div class="pct num ' + cls(r.pnl) + '">' + smoney(r.pnl) + " · " + pct(r.pnl_pct) + "</div></span></button>";
      });
      h += "</div></div>";
    });
    return h;
  }

  // ---------------------------------------------------------------- dettaglio di un titolo
  function viewAsset(conid) {
    var i = ins(conid), a = asset(conid), p = D.posBy[conid], h = "";
    var row = (D.summary.positions || []).filter(function (r) { return r.conid === conid; })[0];
    h += '<button type="button" class="back" data-back>‹ Indietro</button>';
    h += '<div class="dhead"><h1>' + esc(i.symbol || "") + '</h1><div class="sub">' + esc(niceName(conid)) + "</div>";
    h += '<div class="chips">' + [a.categoria, i.isin, i.exchange, i.currency].filter(Boolean).map(function (x) { return '<span class="chip">' + esc(x) + "</span>"; }).join("") + "</div></div>";
    if (p) {
      var cur = p.currency, fx = p.fx || 1, base = cur !== CUR;
      h += '<div class="card"><h2>Posizione</h2><div class="grid2">' +
        cell("Quantità", qty(p.qty)) +
        cell("Peso", row && D.summary.invested ? num(row.value / D.summary.invested * 100, 1) + "% dell'investito" : "–") +
        cell("Prezzo medio di carico", money(p.avg_price, cur, 4)) +
        cell("Prezzo di mercato", money(p.mark, cur, 4)) +
        cell("Valore", money(p.value, cur) + (base ? '<div class="sub">' + money(p.value * fx) + "</div>" : "")) +
        cell("Costo", money(p.cost, cur) + (base ? '<div class="sub">' + money(p.cost * fx) + "</div>" : "")) +
        cell("P&amp;L non realizzato", '<span class="' + cls(p.pnl) + '">' + smoney(p.pnl, cur) + "</span>" + (base ? '<div class="sub ' + cls(p.pnl) + '">' + smoney(p.pnl * fx) + "</div>" : "")) +
        cell("Rendimento", '<span class="' + cls(p.pnl) + '">' + pct(p.cost ? p.pnl / p.cost * 100 : 0) + "</span>") +
        "</div>" + (base ? '<div class="sub" style="margin-top:8px">Valori in ' + esc(cur) + "; sotto, in " + esc(CUR) + " al cambio del " + dmy(p.date) + ".</div>" : "") + "</div>";
    } else {
      h += '<div class="msg">Nessuna posizione aperta su questo titolo.</div>';
    }
    h += '<div class="card"><h2>Prezzi delle operazioni</h2><svg class="chart" id="achart" height="190"></svg><div class="tip" id="atip"></div></div>';
    var facts = [["Nome", a.nome || i.description], ["Indice", a.indice], ["TER", a.ter != null ? num(a.ter, 2) + "%" : null], ["Dividendi", a.dividendi],
      ["Replica", a.replica], ["Emittente", a.emittente], ["Domicilio", a.domicilio], ["ISIN", i.isin], ["Borsa", i.exchange], ["Tipo", [i.asset, i.sub].filter(Boolean).join(" · ")], ["Note", a.note]];
    h += '<div class="card"><h2>Scheda</h2><dl class="facts">' + facts.filter(function (f) { return f[1]; }).map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + esc(f[1]) + "</dd>"; }).join("") + "</dl></div>";
    var trs = D.tradeList.filter(function (t) { return t.conid === conid; });
    h += '<div class="card"><h2>Operazioni (' + trs.length + ")</h2>" + tradesHtml(trs, false) + "</div>";
    return h;
  }
  function cell(l, v) { return '<div><div class="lbl">' + l + '</div><div class="v num">' + v + "</div></div>"; }

  function tradesHtml(list, withSym) {
    if (!list.length) return '<div class="sub">Nessuna operazione in archivio.</div>';
    var h = '<div class="trs">', month = "";
    list.forEach(function (t) {
      var m = t.date.slice(0, 7);
      if (withSym && m !== month) { month = m; h += '<div class="month">' + MONTHS_L[+m.slice(5, 7) - 1] + " " + m.slice(0, 4) + "</div>"; }
      var buy = t.side === "BUY";
      h += '<div class="tr"><span class="d num">' + dmy(t.date) + '</span><span class="side ' + (buy ? "up" : "down") + '">' + (buy ? "ACQ" : "VEN") + "</span>" +
        '<span class="q num">' + (withSym ? '<b style="font-family:var(--font-ui)">' + esc(t.symbol) + "</b> " : "") + qty(Math.abs(t.qty)) + " × " + money(t.price, t.currency, 4) + "</span>" +
        '<span class="tot num">' + money(Math.abs(t.proceeds), t.currency) + "</span>" +
        '<span class="x num">comm. ' + money(Math.abs(t.commission), t.commission_currency || t.currency) + (t.realized ? ' · realizzato <span class="' + cls(t.realized) + '">' + smoney(t.realized, t.currency) + "</span>" : "") + "</span></div>";
    });
    return h + "</div>";
  }

  // ---------------------------------------------------------------- operazioni
  function viewTrades() {
    var syms = {}; D.tradeList.forEach(function (t) { syms[t.symbol] = 1; });
    var h = '<div class="chips" style="margin:0 0 4px"><button type="button" class="chip" data-filter="" aria-pressed="' + (!state.filter) + '">Tutte</button>';
    Object.keys(syms).sort().forEach(function (s) { h += '<button type="button" class="chip" data-filter="' + esc(s) + '" aria-pressed="' + (state.filter === s) + '">' + esc(s) + "</button>"; });
    h += "</div>";
    var list = D.tradeList.filter(function (t) { return !state.filter || t.symbol === state.filter; });
    var buys = list.filter(function (t) { return t.side === "BUY"; }).length;
    h += '<div class="sub">' + list.length + " operazioni · " + buys + " acquisti · " + (list.length - buys) + " vendite</div>";
    return h + '<div class="card">' + tradesHtml(list, true) + "</div>";
  }

  // ---------------------------------------------------------------- storico
  var RANGES = [["1M", 31], ["3M", 92], ["6M", 183], ["1A", 366], ["Tutto", 1e6]];
  function navSeries() {
    var dates = Object.keys(D.nav || {}).sort(), last = dates[dates.length - 1];
    if (!last) return [];
    var days = RANGES.filter(function (r) { return r[0] === state.range; })[0][1];
    var from = new Date(Date.parse(last) - days * 864e5).toISOString().slice(0, 10);
    return dates.filter(function (d) { return d >= from; }).map(function (d) { return { d: d, v: D.nav[d].total, c: D.nav[d].cash }; });
  }
  function viewHistory() {
    var h = '<div class="card"><h2>Valore del conto</h2><div class="ranges">';
    RANGES.forEach(function (r) { h += '<button type="button" class="chip" data-range="' + r[0] + '" aria-pressed="' + (state.range === r[0]) + '">' + r[0] + "</button>"; });
    h += '</div><div class="tip" id="ntip"></div><svg class="chart" id="nchart" height="230"></svg></div>';
    var c = D.change_in_nav;
    if (c) {
      h += '<div class="card"><h2>Dal ' + dmy(c.from_) + " al " + dmy(c.to) + '</h2><dl class="facts">' +
        fact("Valore iniziale", money(c.startingValue)) + fact("Variazione di mercato", smoney(c.mtm), c.mtm) +
        fact("Versamenti e prelievi", smoney(c.depositsWithdrawals)) + fact("Dividendi", smoney(c.dividends), c.dividends) +
        fact("Interessi", smoney(c.interest), c.interest) + fact("Commissioni", smoney(c.commissions), c.commissions) +
        fact("Ritenute", smoney(c.withholdingTax), c.withholdingTax) + fact("Valore finale", money(c.endingValue)) +
        fact("Rendimento (TWR)", pct(c.twr), c.twr) + "</dl></div>";
    }
    return h;
  }
  function fact(l, v, sign) { return "<dt>" + l + '</dt><dd class="num ' + (sign != null ? cls(sign) : "") + '">' + v + "</dd>"; }

  // ---------------------------------------------------------------- grafici SVG
  function niceTicks(lo, hi, n) {
    var span = hi - lo || Math.abs(hi) || 1, step = Math.pow(10, Math.floor(Math.log10(span / n))), err = span / n / step;
    step *= err >= 7.5 ? 10 : err >= 3 ? 5 : err >= 1.5 ? 2 : 1;
    var out = []; for (var v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
    return out;
  }
  function frame(svg, lo, hi, fmt) {
    var W = svg.clientWidth || 320, H = +svg.getAttribute("height"), L = 8, R = 56, T = 10, B = 22;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.02 || 1; lo -= pad; hi += pad;
    var y = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
    var g = "";
    niceTicks(lo, hi, 4).forEach(function (v) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + tok("--line") + '" stroke-width="1"/>' +
        '<text x="' + (W - R + 6) + '" y="' + (y(v) + 4) + '">' + esc(fmt(v)) + "</text>";
    });
    return { W: W, H: H, L: L, R: R, T: T, B: B, y: y, grid: g };
  }
  function short(v) { return Math.abs(v) >= 1e4 ? num(v / 1e3, 1) + "k" : num(v, Math.abs(v) < 10 ? 2 : 0); }

  function drawNav() {
    var svg = $("nchart"), s = navSeries(), tip = $("ntip");
    if (s.length < 2) { svg.outerHTML = '<div class="sub">Servono almeno due giorni di dati.</div>'; return; }
    var vals = s.map(function (p) { return p.v; }), f = frame(svg, Math.min.apply(null, vals), Math.max.apply(null, vals), short);
    var t0 = Date.parse(s[0].d), t1 = Date.parse(s[s.length - 1].d);
    var x = function (d) { return f.L + (Date.parse(d) - t0) / ((t1 - t0) || 1) * (f.W - f.L - f.R); };
    var line = s.map(function (p, i) { return (i ? "L" : "M") + x(p.d).toFixed(1) + " " + f.y(p.v).toFixed(1); }).join(" ");
    var area = line + " L" + x(s[s.length - 1].d).toFixed(1) + " " + (f.H - f.B) + " L" + x(s[0].d).toFixed(1) + " " + (f.H - f.B) + " Z";
    var ch = vals[vals.length - 1] - vals[0], col = tok(ch >= 0 ? "--up" : "--down");
    var labels = "", step = Math.max(1, Math.floor(s.length / 4));
    for (var i = 0; i < s.length; i += step) labels += '<text x="' + x(s[i].d) + '" y="' + (f.H - 6) + '" text-anchor="' + (i === 0 ? "start" : "middle") + '">' + dm(s[i].d) + "</text>";
    svg.innerHTML = f.grid + '<path d="' + area + '" fill="' + col + '" fill-opacity="0.10"/><path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>' +
      labels + '<line id="ncur" y1="' + f.T + '" y2="' + (f.H - f.B) + '" stroke="' + tok("--muted") + '" stroke-dasharray="3 3" visibility="hidden"/><circle id="ndot" r="4" fill="' + col + '" visibility="hidden"/>';
    var base = "dal " + dmy(s[0].d) + ': <b class="num ' + cls(ch) + '">' + smoney(ch) + " (" + pct(vals[0] ? ch / vals[0] * 100 : 0) + ")</b>";
    tip.innerHTML = base;
    function at(ev) {
      var r = svg.getBoundingClientRect(), px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      var k = 0, best = 1e9; s.forEach(function (p, i) { var d = Math.abs(x(p.d) - px * f.W / r.width); if (d < best) { best = d; k = i; } });
      var p = s[k]; $("ncur").setAttribute("x1", x(p.d)); $("ncur").setAttribute("x2", x(p.d)); $("ncur").setAttribute("visibility", "visible");
      $("ndot").setAttribute("cx", x(p.d)); $("ndot").setAttribute("cy", f.y(p.v)); $("ndot").setAttribute("visibility", "visible");
      tip.innerHTML = dmy(p.d) + ': <b class="num">' + money(p.v) + "</b> · liquidità " + money(p.c);
    }
    function out() { $("ncur").setAttribute("visibility", "hidden"); $("ndot").setAttribute("visibility", "hidden"); tip.innerHTML = base; }
    svg.addEventListener("pointermove", at); svg.addEventListener("pointerdown", at); svg.addEventListener("pointerleave", out);
  }

  function drawAssetChart(conid) {
    var svg = $("achart"), tip = $("atip"), p = D.posBy[conid];
    var trs = D.tradeList.filter(function (t) { return t.conid === conid; }).slice().reverse();
    var snaps = Object.keys(D.snapshots || {}).sort().filter(function (d) { return D.snapshots[d][conid]; })
      .map(function (d) { return { d: d, v: D.snapshots[d][conid][1] }; });
    if (!trs.length && snaps.length < 2) { svg.outerHTML = '<div class="sub">Nessun dato da mostrare.</div>'; return; }
    var pts = trs.map(function (t) { return t.price; }).concat(snaps.map(function (s) { return s.v; }));
    if (p) pts.push(p.avg_price, p.mark);
    var f = frame(svg, Math.min.apply(null, pts), Math.max.apply(null, pts), short);
    var dates = trs.map(function (t) { return t.date; }).concat(snaps.map(function (s) { return s.d; }));
    if (p && p.date) dates.push(p.date);
    dates.sort();
    var t0 = Date.parse(dates[0]), t1 = Date.parse(dates[dates.length - 1]);
    if (t1 - t0 < 864e5 * 7) { t0 -= 864e5 * 3; t1 += 864e5 * 3; }
    var x = function (d) { return f.L + 6 + (Date.parse(d) - t0) / ((t1 - t0) || 1) * (f.W - f.L - f.R - 12); };
    var g = f.grid;
    if (p) {
      g += '<line x1="' + f.L + '" x2="' + (f.W - f.R) + '" y1="' + f.y(p.avg_price) + '" y2="' + f.y(p.avg_price) + '" stroke="' + tok("--fg") + '" stroke-width="1.2" stroke-dasharray="5 4"/>';
      g += '<line x1="' + f.L + '" x2="' + (f.W - f.R) + '" y1="' + f.y(p.mark) + '" y2="' + f.y(p.mark) + '" stroke="' + tok("--accent") + '" stroke-width="1.5"/>';
    }
    if (snaps.length > 1) g += '<path fill="none" stroke="' + tok("--accent") + '" stroke-width="2" d="' + snaps.map(function (s, i) { return (i ? "L" : "M") + x(s.d) + " " + f.y(s.v); }).join(" ") + '"/>';
    trs.forEach(function (t, i) {
      var buy = t.side === "BUY", cx = x(t.date), cy = f.y(t.price);
      g += buy ? '<path data-i="' + i + '" d="M' + cx + " " + (cy - 6) + " L" + (cx + 6) + " " + (cy + 5) + " L" + (cx - 6) + " " + (cy + 5) + ' Z" fill="' + tok("--up") + '"/>'
               : '<path data-i="' + i + '" d="M' + cx + " " + (cy + 6) + " L" + (cx + 6) + " " + (cy - 5) + " L" + (cx - 6) + " " + (cy - 5) + ' Z" fill="' + tok("--down") + '"/>';
    });
    g += '<text x="' + (f.L + 4) + '" y="' + (f.H - 6) + '">' + dm(new Date(t0).toISOString().slice(0, 10)) + '</text><text x="' + (f.W - f.R) + '" y="' + (f.H - 6) + '" text-anchor="end">' + dm(new Date(t1).toISOString().slice(0, 10)) + "</text>";
    svg.innerHTML = g;
    var cur = p ? p.currency : (trs[0] || {}).currency;
    var base = (p ? '<span style="color:var(--accent)">━</span> prezzo ' + money(p.mark, cur, 2) + ' &nbsp;<span>┅</span> medio ' + money(p.avg_price, cur, 2) + " &nbsp;" : "") +
      '<span class="up">▲</span> acquisti <span class="down">▼</span> vendite';
    tip.innerHTML = base;
    svg.addEventListener("pointerdown", function (ev) {
      var r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * f.W / r.width, k = -1, best = 1e9;
      trs.forEach(function (t, i) { var d = Math.abs(x(t.date) - px); if (d < best) { best = d; k = i; } });
      if (k < 0 || best > 24) { tip.innerHTML = base; return; }
      var t = trs[k];
      tip.innerHTML = dmy(t.date) + ' · <b class="' + (t.side === "BUY" ? "up" : "down") + '">' + (t.side === "BUY" ? "acquisto" : "vendita") + "</b> " + qty(Math.abs(t.qty)) + " × <b class=\"num\">" + money(t.price, t.currency, 4) + "</b>";
    });
  }

  // ---------------------------------------------------------------- avvio
  function start(data) {
    D = data;
    if (!D.summary) throw new Error("archivio senza riepilogo: esegui 'python -m phub run'");
    prep();
    $("msg").hidden = true; $("tabs").hidden = false; $("foot").hidden = false;
    $("sub").textContent = (DEMO ? "DATI DI PROVA · " : "") + "dati al " + dmy(D.summary.date);
    var up = D.meta && D.meta.updated ? new Date(D.meta.updated) : null;
    $("foot").textContent = "Fonte: Interactive Brokers (report Flex)" + (up ? " · aggiornato il " + up.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "");
    history.replaceState({ view: "home" }, "");
    render();
  }

  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
    msg("Questo browser non sa decifrare i dati: aggiorna Telegram o il browser.", true);
    return;
  }
  window.addEventListener("hashchange", function () { location.reload(); });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (D) render(); }, 150); });
  load().then(start).catch(function (e) {
    var m = e && e.message ? e.message : String(e);
    if (m === "NOLINK") msg('Apri il portafoglio dal pulsante del bot Telegram. Vuoi vedere com\'è fatto? <a href="#demo">Apri i dati di prova</a>.');
    else msg("Dati non disponibili: " + esc(m), true);
  });
})();
</script>
</body>
